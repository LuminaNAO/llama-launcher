# Tune: test-32k-slot-v1
# Per-model config for: gemma-4-26B-A4B-it (Q8_0, MoE 128 experts / 8 active)
# Target: rapid testing of slot save/restore + proxy behavior
#
# Why this tune exists:
#   Gemma-4-26B-A4B is a 4B-active MoE → fast decode (~50+ tok/s) and fast
#   prefill (cold 32k context loads in ~10-15 sec). Pairs well with
#   SLOT_SAVE_PATH for end-to-end slot persistence testing without waiting
#   minutes for MiniMax-class cold starts.
#
#   At 32k ctx, slot files are small (~80 MB), restore is essentially
#   instant. Good for iterating on proxy/launcher changes.
#
# Architecture: same Gemma 4 MoE as the production tunes
#   - 30 layers: 25 SWA + 5 full attention
#   - 128 experts, 8 active per token
#   - Context capped at 32k for fast iteration
#
# Memory budget (32k, 1 slot, q8_0 KV):
#   Model weights:               ~28.0 GB
#   KV cache (32k):              ~0.35 GB
#   Compute buffers:             ~2.0 GB
#   ──────────────────────────────────────
#   On-device total:             ~30.4 GB

# ── Context & Scheduling ────────────────────────────────────────────────────
CONTEXT=32768
PARALLEL=1

# ── KV Cache ────────────────────────────────────────────────────────────────
# CACHE_RAM=0: cross-session warmth provided by SLOT_SAVE_PATH
CACHE_RAM=0
CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0
KV_UNIFIED=1

# ── Slot persistence (auto-managed by llama-deep-proxy) ─────────────────────
# Forces --proxy on at launch (per launcher logic). With 32k ctx the slot
# files are tiny (~80 MB each), so the dir won't bloat during iteration.
# Launcher auto-namespaces per-quant: actual dir = $SLOT_SAVE_PATH/$(basename
# $model_path .gguf)/ — each .gguf gets an isolated cache pool.
SLOT_SAVE_PATH=/mnt/storage/llama-slots

# ── Checkpoints ─────────────────────────────────────────────────────────────
CHECKPOINT_INTERVAL=4096
CHECKPOINT_MAX=16

# ── GPU Offload ─────────────────────────────────────────────────────────────
NGL=99
FLASH_ATTN=1

# ── Sampling ────────────────────────────────────────────────────────────────
TEMP=1.0
TOP_P=0.95
TOP_K=64

# ── Reasoning / Thinking ────────────────────────────────────────────────────
REASONING=on
REASONING_BUDGET=2048

# ── Server ──────────────────────────────────────────────────────────────────
HOST=0.0.0.0
PORT=40801
API_KEY=ollama-local
TIMEOUT=3600
THREADS=32

# ── I/O & Memory ────────────────────────────────────────────────────────────
NO_MMAP=1
DIO=1

# ── Template ────────────────────────────────────────────────────────────────
JINJA=1
