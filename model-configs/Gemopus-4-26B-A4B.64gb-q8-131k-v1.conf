# Tune: 64gb-q8-131k-v1
# Per-model config for: Gemopus-4-26B-A4B-it (Q8_0, MoE 128 experts / 8 active)
# Fine-tune of Gemma 4 26B by Jackrong — "stability first" SFT focusing on
# answer quality, structure, clarity, and consistency while preserving
# Gemma 4's native reasoning order.
# Target: 64 GB system, ~50 GB ceiling
# Based on: gemma-4-26B-A4B.64gb-q8-131k-v6 (same architecture)
#
# Architecture: Gemma 4 MoE with Sliding Window Attention
#   - 30 layers: 25 SWA (window=1024) + 5 full attention
#   - 128 experts, 8 active per token (26B total, ~4B active)
#   - Context: 131072 (agents auto-compact at ~131K)
#
# Memory budget estimate (131K, 1 slot):
#   Model weights (Q8_0):        ~27.0 GB
#   KV cache (1 slot × 131K):     ~1.4 GB
#   CACHE_RAM (prompt cache):      7.0 GB
#   Checkpoints (16 × 265 MiB):  ~4.1 GB
#   Compute buffers:              ~2.5 GB
#   Estimated total:             ~42.0 GB
#   Headroom to 50 GB limit:     ~8.0 GB
#
# Model card recommended sampling: temp=1.0, top_p=0.95, top_k=64
#
# Stress test results (b8783, parallel_tool_calls=true, Q8_0):
#   PEG (JINJA=0): 100% pass, all 3 tools, baseline through 120K
#   JINJA=1:       100% pass, identical results

# ── Context & Scheduling ────────────────────────────────────────────────────
# PARALLEL=1: SWA checkpoint invalidation with >1 slot (#21468)
CONTEXT=131072
PARALLEL=1

# ── KV Cache ────────────────────────────────────────────────────────────────
CACHE_RAM=7168
CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0
KV_UNIFIED=1

# ── Checkpoints ─────────────────────────────────────────────────────────────
CHECKPOINT_INTERVAL=8192
CHECKPOINT_MAX=16

# ── GPU Offload ─────────────────────────────────────────────────────────────
NGL=99
FLASH_ATTN=1

# ── Sampling ────────────────────────────────────────────────────────────────
# Per model card: temperature=1.0, top_p=0.95, top_k=64
TEMP=1.0
TOP_P=0.95
TOP_K=64

# ── Reasoning / Thinking ────────────────────────────────────────────────────
# Same thinking format as base Gemma 4: <|channel>thought...<channel|>
REASONING=on
REASONING_BUDGET=8192

# ── Anti-repeat ─────────────────────────────────────────────────────────────
# DRY OFF: breaks tool call emission. Not needed at temp=1.0.
# DRY_MULTIPLIER=0.8
# DRY_BASE=1.75
# DRY_ALLOWED_LENGTH=2
# DRY_PENALTY_LAST_N=512

# ── Server ──────────────────────────────────────────────────────────────────
HOST=0.0.0.0
PORT=40801
API_KEY=ollama-local
TIMEOUT=3600
THREADS=32

# ── I/O & Memory ────────────────────────────────────────────────────────────
NO_MMAP=1
DIO=1

# ── Template ────────────────────────────────────────────────────────────────
JINJA=0

# ── Extra ───────────────────────────────────────────────────────────────────
# EXTRA_ARGS=""
