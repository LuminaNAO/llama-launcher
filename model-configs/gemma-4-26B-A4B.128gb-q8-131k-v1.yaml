kind: llama-launcher-tune
version: 1
name: "128gb-q8-131k-v1"
model: "gemma-4-26B-A4B"
metadata:
  shareable: true
  notes: |-
    Tune: 128gb-q8-131k-v1
    Per-model config for: gemma-4-26B-A4B-it (Q8_0, MoE 128 experts / 8 active)
    Target: 128 GB system, ~100 GB ceiling
    Stress test results (b8783, parallel_tool_calls=true):
    JINJA=1: 100% pass rate baseline through 120K (75K prompt tokens)
    JINJA=0: also 100% pass after upstream Gemma 4 parsing edge case fix (e21cdc11a)
    Both parsers equivalent for Q8_0 — JINJA=1 kept for consistency with fine-tunes
    Architecture: Gemma 4 MoE with Sliding Window Attention
    - 30 layers: 25 SWA (window=1024) + 5 full attention
    - 128 experts, 8 active per token (26B total, ~4B active)
    - Context: 131072 (agents auto-compact at ~131K)
    Memory budget estimate (131K, 1 slot):
    Model weights (Q8_0):        ~28.0 GB
    KV cache (1 slot × 131K):     ~1.4 GB
    CACHE_RAM ceiling (RAM, spills to swap — see docs/CACHE-RAM.md):     30.0 GB
    Checkpoints (76 × 265 MiB): ~19.7 GB
    Compute buffers:              ~2.5 GB
    Estimated total:             ~82.0 GB
    Headroom to 100 GB limit:   ~18.0 GB
    Benefit over 64 GB tune:
    - 30 GB prompt cache (vs 6 GB): nearly all system prompts + tool defs
    stay cached across sessions. Eliminates most reprompt latency.
    - 76 checkpoints (vs 16): full checkpoint coverage — slot switches
    almost never require reprocessing from a distant checkpoint.
    PARALLEL=1: SWA checkpoint invalidation with >1 slot (#21468)
    DRY OFF: breaks tool call emission. Not needed at temp=1.0.
    DRY_MULTIPLIER=0.8
    DRY_BASE=1.75
    DRY_ALLOWED_LENGTH=2
    DRY_PENALTY_LAST_N=512
    JINJA=1: test whether JINJA parser is more stable than PEG at high context
    with Q8_0 quant (supergemma4 Q4_K_M: PEG broke ~37K, JINJA ~45K)
    EXTRA_ARGS=""
settings:
  API_KEY: "ollama-local"
  CACHE_RAM: "30720"
  CACHE_TYPE_K: "q8_0"
  CACHE_TYPE_V: "q8_0"
  CHECKPOINT_MAX: "76"
  CONTEXT: "131072"
  DIO: "1"
  FLASH_ATTN: "1"
  HOST: "0.0.0.0"
  JINJA: "1"
  KV_UNIFIED: "1"
  NGL: "99"
  NO_MMAP: "1"
  PARALLEL: "1"
  PORT: "40801"
  REASONING: "on"
  REASONING_BUDGET: "8192"
  TEMP: "1.0"
  THREADS: "32"
  TIMEOUT: "3600"
  TOP_K: "64"
  TOP_P: "0.95"
