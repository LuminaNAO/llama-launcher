# Tune: 64gb-q4-140k-coding-v4
# Per-model config for: Qwen3.6-27B-MTP (hybrid Gated-DeltaNet + Gated-Attention,
# trained with multi-token prediction). Tuned for coding / agentic tasks.
# Source: https://huggingface.co/unsloth/Qwen3.6-27B-MTP-GGUF
# Target: Strix Halo / AMD Ryzen AI Max+ 395 - 64 GB unified memory
# Backend: rocm or vulkan mainline with MTP enabled by runtime flags
#
# v4 corrects the v3 memory model. v3 targeted ~52 GB live memory, but on the
# ROCm unified-memory path the combination of NO_MMAP=1, NGL=99, and 100
# recurrent checkpoints caused separate CPU-anonymous and GPU-visible
# allocations to compete for the same 64 GB pool. The observed v3 launch used
# roughly 34 GB GPU-visible/GTT memory plus tens of GB of process anonymous
# memory and swap.
#
# What v4 changes vs v3:
#   - NO_MMAP 1 -> 0:
#       keep GGUF weights file-backed so the kernel can page/cache them instead
#       of forcing a full anonymous host copy alongside GPU-visible allocations.
#   - CHECKPOINT_MAX 100 -> 64:
#       full-140k checkpoint worst case drops from ~30.5 GB to ~19.5 GB.
#   - MIN_FREE_GB / MAX_TOTAL_SLOTS_GB set explicitly:
#       bound disk slot-cache growth across model slot directories.
#
# Corrected worst-case RAM budget at 143360 ctx, q4_0 KV with rotor:
#   Baseline model/runtime from v3 estimate:       ~21.6 GB
#   ROCm/driver/kernel/accounting margin:           ~4.0 GB
#   Active-slot checkpoints:
#     64 x ~305 MB at full 140k context:           ~19.5 GB
#   --------------------------------------------------------
#   Corrected worst case target:                   ~45.1 GB
#
# This leaves about 7 GB below the 52 GB operational target and about 19 GB
# below physical 64 GB for OpenClaw, proxy, OS, filesystem cache, and variance.
# If this still swaps on this machine, reduce CHECKPOINT_MAX to 48 before
# reducing context.
#
# Context rationale inherited from v3:
#   CONTEXT=143360 (140k) keeps enough room for observed ~95k coding prompts
#   while avoiding the 262k KV allocation from earlier exploratory tunes.
#
# Per-checkpoint size scales with position (~150 MB at pos 0, ~305 MB at
# pos 140k, slope ~1.1 MB per 1k pos; empirical measurement from v3 notes).
#
# Disk sidecar sizing (per saved prompt, on /mnt/storage/llama-slots):
#   .bin (active state @ 95k):               ~175 MB
#   .bin.ckpt (64 checkpoints @ ~250 MB):    ~16 GB
# So each saved prompt is roughly 16 GB on disk for typical 95k sessions.

# -- Context & Scheduling ----------------------------------------------------
CONTEXT=143360
PARALLEL=1

# -- KV Cache ----------------------------------------------------------------
# q4_0 K/V with rotor activation rotation (auto-engaged: head_dim=256).
# No CACHE_RAM: disk-backed slot cache is the source of truth for prompt
# switching. This is intentional for 64 GB systems.
CACHE_RAM=0
CACHE_TYPE_K=q4_0
CACHE_TYPE_V=q4_0
KV_UNIFIED=1

# -- HDD Slot Cache ----------------------------------------------------------
# The launcher namespaces this by model basename before passing
# --slot-save-path to llama-server.
SLOT_SAVE_PATH=/mnt/storage/llama-slots
MIN_FREE_GB=80
MAX_TOTAL_SLOTS_GB=180

# -- Checkpoints -------------------------------------------------------------
# Upstream b9394+ replaced --checkpoint-every-n-tokens with template-aware
# boundary placement gated by --checkpoint-min-step (minimum spacing). The
# server now drops checkpoints at user-message boundaries rather than at
# fixed token intervals, so the resume granularity matches the natural prompt-
# edit points.
#
# Sizing for 143360 ctx / 64 checkpoints:
#   uniform spacing = 143360 / 64 = 2240 → round to 2048
#   ceiling at min-step 2048 → 70 max; LRU evicts ~6 oldest at the context
#   head (rewind that far is unrealistic). Slight oversubscription keeps
#   checkpoint density high through the active editing window.
CHECKPOINT_MIN_STEP=2048
CHECKPOINT_MAX=64

# -- GPU Offload -------------------------------------------------------------
NGL=99
FLASH_ATTN=1

# -- Sampling (HF: Thinking for precise coding) ------------------------------
TEMP=0.6
TOP_P=0.95
TOP_K=20

# -- Server ------------------------------------------------------------------
HOST=0.0.0.0
PORT=40801
API_KEY=ollama-local
TIMEOUT=3600

# -- I/O & Memory ------------------------------------------------------------
# Keep mmap enabled. On unified-memory ROCm, --no-mmap caused anonymous host
# copies to compete with GPU-visible allocations from the same physical pool.
NO_MMAP=0
DIO=1

# -- Template / Reasoning ----------------------------------------------------
# JINJA=1 (launcher default) is needed for Qwen3's chat template / tool calls.
# Reasoning=auto picks up the thinking block from the embedded template.

# -- MTP speculative decoding ------------------------------------------------
# n-max=2 matches the existing v3 tune and the current Qwen3.6 MTP configs.
EXTRA_ARGS="--spec-type draft-mtp --spec-draft-n-max 2"
