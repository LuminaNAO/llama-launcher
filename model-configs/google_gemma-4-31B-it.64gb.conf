# Per-model config for: gemma-4-31B (all quants) — 64GB profile
# Gemma 4 31B dense with iSWA (interleaved sliding window attention)
#
# Budget: 55 GB max to leave headroom for OS + gateway + whisper
#   - Model weights (Q6_K_L): ~27 GB
#   - KV cache (65K ctx, q8_0): ~2.7 GB
#   - 8 checkpoints × 638 MB: ~5.1 GB
#   - Prompt cache save headroom: ~3.3 GB
#   - Estimated peak: ~42 GB
#
# The previous 131K/parallel-1/32-checkpoint config OOM'd during prompt cache
# save at 64K tokens (3.3 GB allocation on top of 13 GB of checkpoints).
#
# NOTE: Gemma 4 cache reuse is broken upstream (llama.cpp #21468).
# Prompt cache and checkpoints have reduced benefit until that's fixed.

CONTEXT=65536
PARALLEL=1
CACHE_RAM=4096
CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0
CHECKPOINT_INTERVAL=4096
CHECKPOINT_MAX=8

# Disable --jinja: Gemma 4 chat template triggers std::regex stack overflow
# in llama.cpp's Jinja parser. The native peg-gemma4 parser works without it.
JINJA=0
