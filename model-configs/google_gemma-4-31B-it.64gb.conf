# Per-model config for: gemma-4-31B (all quants) — 64GB system profile
# Gemma 4 31B dense with iSWA (interleaved sliding window attention)
#
# Budget: 55GB max to leave headroom for OS + gateway + whisper
# Model weights (Q6_K_L): ~27 GB
# KV cache (64K ctx, q8_0): ~2.7 GB
# Checkpoints (8 × ~638 MB): ~5.1 GB
# Prompt cache: 4 GB
# Peak with cache save: ~42 GB (safe margin)
#
# NOTE: cache reuse is broken for Gemma 4 (llama.cpp #21468) so prompt cache
# and checkpoints have reduced benefit until upstream fixes land.

CONTEXT=65536
PARALLEL=1
CACHE_RAM=4096
CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0
CHECKPOINT_INTERVAL=4096
CHECKPOINT_MAX=8

# Disable --jinja: Gemma 4 chat template triggers std::regex stack overflow
# in llama.cpp's Jinja parser. The native peg-gemma4 parser works without it.
JINJA=0
