# Tune: 64gb-q8-131k-v6
# Per-model config for: gemma-4-26B-A4B-it (Q8_0/Q6_K_XL, MoE 128 experts / 8 active)
# Target: 64 GB system, HARD CEILING 50 GB
#
# REQUIRES: llama.cpp build >= b8763 (ff5ef8278 or later)
#   Critical Gemma 4 fixes included:
#   - d7ff074c8: reasoning budget sampler — thinking tags for Gemma 4
#   - ddf03c6d9: ambiguous grammar rule in tool call dict key parsing
#   - 3fc65063d: auto-detect updated vs old Gemma 4 templates
#   - 0ec191e1d: tokenizer byte-fallback edge case fix
#   - 057dba336: multimodal padding token scaling fix (vision)
#   - e62fa13c2: shared-KV tensor loading more permissive
#   - b136b62cf: structured output $refs fix in json_schema
#
# Architecture: Gemma 4 MoE with Sliding Window Attention
#   - 30 layers: 25 SWA (window=1024) + 5 full attention (layers 5,11,17,23,29)
#   - Full attn layers: 2 KV heads, head_dim=512
#   - SWA layers: 8 KV heads, head_dim=256, window=1024 (fixed cost)
#   - 128 experts, 8 active per token (26B total, ~4B active)
#   - Context: 262144 native (capped to 131072 — agents auto-compact at ~131K)
#   - Thinking model: uses <|channel>thought tags (peg-gemma4 template)
#
# v6 changes vs v5:
#   - CONTEXT 262144 → 131072: agents auto-compact at ~131K and never use more.
#     Halves full-attention KV cache (~1.3 GB savings). Faster prompt processing.
#   - TEMP 1.5 → 1.0: revert to Google default. DRY handles repeat prevention.
#   - DRY_PENALTY_LAST_N 256 → 512: wider window catches repeat patterns that
#     emerge at 80K+ context. 512 is still well under 131K to avoid over-penalizing.
#   - CACHE_RAM 4096 → 6144: multi-session use — 2 concurrent sessions with
#     different system prompts + tool definitions need more prompt cache.
#   - CHECKPOINT_MAX 12 → 16: more headroom for 2-session checkpoint divergence.
#     Worst case: 16 × 265 MiB (Q6_K_XL/ROCm) = ~4.1 GB.
#   - CHECKPOINT_INTERVAL 8192 → 4096: finer restore points at 131K context.
#     Reduces re-processing time on slot switches.
#   - Build updated to b8770: adds Gemma 4 audio, structured output $refs fix.
#
# Use case: freeclaw coding agent backend
#   - Single slot (PARALLEL=1) to avoid SWA checkpoint invalidation (#21468)
#   - Agents auto-compact at ~131K context
#   - Requests arrive randomly across sessions (queued, not concurrent)
#   - Long sustained tasks (30+ minutes)
#
# Identity confusion notes (for agent/group chat use):
#   - MoE 26B returns empty responses when system prompts exceed ~500 chars
#     (Ollama #15428). Keep system prompts concise or split across messages.
#   - Strip thought blocks from previous turns before feeding back — Google:
#     "the model wasn't explicitly trained with raw thoughts in prompts
#     outside tool-call scenarios." Feeding thoughts back destabilizes roles.
#   - Reinforce identity in both system prompt and first user message.
#
# Memory budget estimate (131K, 2 slots, ROCm):
#   Model weights (Q8_0):        ~28.0 GB
#   KV cache (2 slots × 131K):    ~2.8 GB
#   CACHE_RAM ceiling (RAM, spills to swap — see docs/CACHE-RAM.md):      6.0 GB
#   Checkpoints (16 × 265 MiB):  ~4.1 GB
#   Estimated total:             ~41.0 GB
#   Headroom to 50 GB limit:     ~9.0 GB
#
# Known issues (as of 2026-04-13):
#   - Vulkan: <unused> token loops (#21516) — OPEN
#   - Server infinite output (#21365) — OPEN, backend-agnostic
#   - Tool call array serialization (#21384) — OPEN (mitigated by JINJA=0)
#   - Cache reuse broken for shared-KV models (#21468) — PR #21749 pending
#   - Tool calls: use parallel_tool_calls=false to prevent loops (#21375)
#
# Vision: mmproj available, enable at launch prompt

# ── Context & Scheduling ────────────────────────────────────────────────────
CONTEXT=131072
PARALLEL=1

# ── KV Cache ────────────────────────────────────────────────────────────────
# KV_UNIFIED is critical for SWA models — lets slots share cached prefixes.
# Without it, every slot switch forces a full reprompt from zero.
# CACHE_RAM: 6 GB covers 2 sessions with different system prompts + tool defs.
CACHE_RAM=7168
CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0
KV_UNIFIED=1

# ── Checkpoints ─────────────────────────────────────────────────────────────
# Finer checkpoints (4096 interval) reduce re-processing on slot switches.
# 16 checkpoints covers multi-session divergence. Worst case ~4.1 GB.
# Checkpoint size varies by quant: 159.5 MiB (Q8_0/Vulkan), 265.6 MiB (Q6_K_XL/ROCm).
CHECKPOINT_INTERVAL=8192
CHECKPOINT_MAX=16

# ── GPU Offload ─────────────────────────────────────────────────────────────
NGL=99
FLASH_ATTN=1

# ── Sampling ────────────────────────────────────────────────────────────────
# Google-recommended defaults. DRY handles repeat prevention at temp=1.0.
TEMP=1.0
TOP_P=0.95
TOP_K=64

# ── Reasoning / Thinking ────────────────────────────────────────────────────
# Force thinking on: with many tools, Gemma 4 skips the thinking phase in
# auto mode. Forcing it on ensures reasoning_content is always populated.
# NOTE: reasoning budget was silently broken before b8763 — now works.
REASONING=on
REASONING_BUDGET=8192

# ── Anti-repeat ─────────────────────────────────────────────────────────────
# DRY disabled: suspected of penalizing repeated JSON structure in tool calls,
# causing model to avoid emitting tool_use tokens. v2 ran without DRY and
# had better tool calling reliability. Re-enable only if repeat loops return
# AND tool calling is unaffected.
# DRY_MULTIPLIER=0.8
# DRY_BASE=1.75
# DRY_ALLOWED_LENGTH=2
# DRY_PENALTY_LAST_N=512
# REPEAT_PENALTY=1.05
# REPEAT_LAST_N=256
# PRESENCE_PENALTY=0.0
# FREQUENCY_PENALTY=0.0

# ── Server ──────────────────────────────────────────────────────────────────
HOST=0.0.0.0
PORT=40801
API_KEY=ollama-local
TIMEOUT=3600
THREADS=32

# ── I/O & Memory ────────────────────────────────────────────────────────────
NO_MMAP=1
DIO=1

# ── Template ────────────────────────────────────────────────────────────────
# Use peg-gemma4 native parser — avoids jinja bugs with tool schemas
# (#21347 upper filter on arrays, #21384 array parameter serialization)
JINJA=0

# ── Extra ───────────────────────────────────────────────────────────────────
# DO NOT use --samplers override — it replaces the entire chain and removes
# DRY from the pipeline even if DRY_MULTIPLIER is set.
# EXTRA_ARGS=""
