# Tune: 64gb-q4-140k-coding-v2
# Per-model config for: Qwen3.6-27B-MTP (hybrid Gated-DeltaNet + Gated-Attention,
# trained with multi-token prediction). Tuned for coding / agentic tasks.
# Source: https://huggingface.co/unsloth/Qwen3.6-27B-MTP-GGUF
# Target: Strix Halo / AMD Ryzen AI Max+ 395 — 64 GB unified
# Backend: rocm-mtp  (am17an/llama.cpp:mtp-clean — upstream PR #22673 fork)
#
# What v2 changes vs v1 (and why):
# v1 was over-allocated for the *agentic* workload pattern observed on real
# traffic (multiple sub-agents, frequent prompt switches, 95k typical prompts).
# Cold prompt-prefills dominated wall time because:
#   1. CACHE_RAM=16 GB fit only ONE 10 GB saved prompt (at MAX=32 checkpoints
#      per prompt). Any prompt switch → eviction → cold PP.
#   2. v1's 262k CONTEXT allocated 4.6 GB of KV buffer that was never used
#      (real prompts capped around 95k).
#
# v2 reclaims that wasted CONTEXT allocation and redistributes it:
#   - CONTEXT 262144 → 143360 (140k):
#       frees ~2.2 GB of KV buffer that v1 was just sitting on. Workload
#       headroom: typical prompts ~95k, 140k cap leaves 47% growth space.
#   - CHECKPOINT_MAX 32 → 24:
#       drops per-saved-prompt size from ~10 GB to ~8 GB (each checkpoint
#       is ~256 MB; 8 fewer = ~2 GB smaller per prompt).
#   - CACHE_RAM 16384 → 16000:
#       (essentially same number, but now meaningful: 16 GB / 8 GB per prompt
#       = exactly 2 prompts fit in cache → prompt-switch cold PPs go away).
#
# VRAM footprint at 143360 ctx, q4_0 KV with rotor:
#   Weights (UD-Q4_K_XL):                  16.4 GB
#   Attention KV (16 layers, q4_0):         2.29 GB  (was 4.35 in v1)
#   DeltaNet recurrent state:               0.4 GB
#   MTP draft context (q4_0):               0.14 GB  (was 0.3 in v1)
#   Compute buffers:                        1.4 GB
#   ──────────────────────────────────────
#   Total VRAM live: ~20.7 GB → ~11 GB headroom on a 32 GB VRAM split.
#
# Host RAM accounting (the part that OOMed at CACHE_RAM=20 GB on v1):
#   Active slot checkpoints (24 × 256 MB):  ~6 GB
#   CACHE_RAM (2 saved prompts × ~8 GB):    ~16 GB
#   Per-request scratch / proxy / etc:      ~2 GB
#   ──────────────────────────────────────
#   Total host RAM live: ~24 GB; on 64 GB box (with ~32 GB unified-to-GPU)
#   that leaves ~8 GB headroom for OS + other workloads.
#
# Why q4_0 KV is safe here: rotor (Walsh-Hadamard activation rotation,
# PRs #21038/#21513/#21352, auto-engaged when head_dim % 64 == 0) smooths
# the value distribution before quantization, closing the q4_0 vs q8_0
# quality gap on this arch (head_dim=256 ✅).
#
# Sampling: HF card's "Thinking mode for precise coding tasks (e.g. WebDev)"
#   temp=0.6, top_p=0.95, top_k=20  (same as v1 and 128gb tune)
#
# IF YOU NEED >140k CONTEXT for a specific session:
#   Override at launch:  --context 200000  (frees back to v1-like territory
#   but you'll lose the second-prompt cache slot).

# ── Context & Scheduling ────────────────────────────────────────────────────
CONTEXT=143360
PARALLEL=1

# ── KV Cache ────────────────────────────────────────────────────────────────
# q4_0 K/V with rotor activation rotation (auto-engaged: head_dim=256).
# CACHE_RAM=16000 chosen specifically to fit TWO ~8 GB saved prompts:
#   per-prompt size ≈ active state (~2 GB) + 24 checkpoints × ~256 MB.
# Two prompts cached = prompt-switching cold PPs eliminated for the common
# case of an agent rotating between 2 active conversations / sub-tasks.
CACHE_RAM=16000
CACHE_TYPE_K=q4_0
CACHE_TYPE_V=q4_0
KV_UNIFIED=1

# ── Checkpoints ─────────────────────────────────────────────────────────────
# MAX=24 (down from v1's 32) — keeps per-saved-prompt at ~8 GB so 2 fit in
# CACHE_RAM. Trade-off: 24 vs 32 checkpoints means slightly less coverage
# for within-prompt divergence (task-16088-style cold PPs). That's still
# 24 × ~256 MB = ~6 GB of state per slot — generous for the hybrid arch.
# INTERVAL stays at 4096; in append-mostly workloads it has limited effect
# (most checkpoints fire at task-end, not interval boundaries — see logs).
CHECKPOINT_INTERVAL=4096
CHECKPOINT_MAX=24

# ── GPU Offload ─────────────────────────────────────────────────────────────
NGL=99
FLASH_ATTN=1

# ── Sampling (HF: Thinking for precise coding) ──────────────────────────────
TEMP=0.6
TOP_P=0.95
TOP_K=20

# ── Server ──────────────────────────────────────────────────────────────────
HOST=0.0.0.0
PORT=40801
API_KEY=ollama-local
TIMEOUT=3600

# ── I/O & Memory ────────────────────────────────────────────────────────────
NO_MMAP=1
DIO=1

# ── Template / Reasoning ────────────────────────────────────────────────────
# JINJA=1 (launcher default) is needed for Qwen3's chat template / tool calls.
# Reasoning=auto picks up the thinking block from the embedded template.

# ── MTP speculative decoding ────────────────────────────────────────────────
# n-max=2: empirically validated on Strix Halo (gfx1151). Daniel Hanchen's
# tweet recommending n-max=6 is calibrated for NVIDIA/CUDA — on RDNA 3.5
# Vulkan it drops TG by 19%, on ROCm by 4% (2026-05-16 bench).
EXTRA_ARGS="--spec-type draft-mtp --spec-draft-n-max 2"
