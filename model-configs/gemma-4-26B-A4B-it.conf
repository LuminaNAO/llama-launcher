# Per-model config for: gemma-4-26B-A4B (all quants)
# Gemma 4 26B MoE (4B active) with iSWA
#
# MoE variant — 4B active per token, should be faster than the 31B dense.
# Model weights: ~26 GB (Q8_0) — lighter than Qwen so more headroom.
# Context capped to 262k (model training limit).

CONTEXT=262144
PARALLEL=2
CACHE_RAM=102400
CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0
KV_UNIFIED=1
CHECKPOINT_INTERVAL=8192
CHECKPOINT_MAX=64

# ── GPU Offload ─────────────────────────────────────────────────────────────
NGL=99
FLASH_ATTN=1

# ── Sampling ────────────────────────────────────────────────────────────────
TEMP=0.3
TOP_P=0.95
TOP_K=20

# ── Anti-repeat ─────────────────────────────────────────────────────────────
# Uncomment to enable anti-repeat sampling.
# DRY_MULTIPLIER=0.0
# DRY_BASE=1.75
# DRY_ALLOWED_LENGTH=2
# DRY_PENALTY_LAST_N=-1
# REPEAT_PENALTY=1.0
# REPEAT_LAST_N=64
# PRESENCE_PENALTY=0.0
# FREQUENCY_PENALTY=0.0

# ── Reasoning / Thinking ────────────────────────────────────────────────────
# REASONING=auto
# REASONING_BUDGET=-1

# ── Server ──────────────────────────────────────────────────────────────────
HOST=0.0.0.0
PORT=40801
API_KEY=ollama-local
TIMEOUT=3600
THREADS=32

# ── I/O & Memory ────────────────────────────────────────────────────────────
NO_MMAP=1
DIO=1

# ── Template ────────────────────────────────────────────────────────────────
# Disable --jinja: Gemma 4 chat template triggers std::regex stack overflow
# in llama.cpp's Jinja parser. The native peg-gemma4 parser works without it.
JINJA=0

# ── Extra ───────────────────────────────────────────────────────────────────
# EXTRA_ARGS=""
