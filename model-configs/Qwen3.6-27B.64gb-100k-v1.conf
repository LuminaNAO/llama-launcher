# Tune: 64gb-100k-v1
# Per-model config for: Qwen3.6-27B-UD-Q5_K_XL (Unsloth Dynamic 2.0 5-bit)
# Target: Strix Halo / AMD Ryzen AI Max+ 395 — 64 GB unified
# Intended use: openclaw coding agent
#
# A/B counterpart to: Qwen3.6-27B-NEO-CODE-Di-IMatrix-MAX.64gb-100k-v1
#   See benchmark-results/baseline-qwen36-davidau-neocode-q6k-rocm-100k-*.md
#   for the DavidAU Q6_K baseline numbers this tune is meant to be compared
#   against. Same arch, same context, same sampling — only model file differs.
#
# Architecture: qwen35 (hybrid linear-attn) — 27B dense, 64 layers
#   - Layout: 16 × (3× Gated DeltaNet + 1× Gated Attention)
#       → 16 of 64 layers carry full-attention KV; the other 48 carry a
#         small ctx-independent SSM/DeltaNet recurrent state
#   - Full attention: 24 Q heads, 4 KV heads (GQA 6:1), head_dim=256
#   - DeltaNet (SSM): state_size=128, inner_size=6144, group_count=16
#   - RoPE theta: 10,000,000   Native ctx: 262,144
#
# Why Unsloth UD-Q5_K_XL over plain Q5_K_M:
#   UD ("Unsloth Dynamic") quants put higher precision on attention/output
#   tensors that disproportionately affect quality, then keep the rest at the
#   nominal bit-width. Net: smaller file (18.66 GiB vs 20.9 for Q6_K) at
#   ~equivalent quality on most metrics, plus the embedded chat template is
#   the developer-role-aware version (vs DavidAU's pre-Unsloth-fixes one).
#
# Expected allocations (102_400 ctx, 1 slot, q8_0 K/V, FA on, -ub 512):
#   Model weights:                ~19,100 MiB   (mlock-pinned CPU bits)
#   KV cache (100k q8_0):          ~3,300 MiB
#   SSM/DeltaNet recurrent state:    ~150 MiB
#   FA scratch @ -ub 512:          ~3,600 MiB
#   Compute buffers:                 ~500 MiB
#   ──────────────────────────────────────────
#   On-device working set:        ~26.6 GB → ~2 GiB lighter than DavidAU Q6_K
#                                 → fits 32–48 GB GPU TTM budget comfortably
#
# Sampling: Qwen-team / DavidAU recommendation for code (kept identical to
# the DavidAU tune so the A/B isolates model+quant, not sampling).
#
# CHAT TEMPLATE: GGUF-embedded template is the Unsloth developer-role-aware
# version (verified). No --chat-template-file override needed.

# ── Context & Scheduling ────────────────────────────────────────────────────
CONTEXT=102400
PARALLEL=1

# ── KV Cache ────────────────────────────────────────────────────────────────
CACHE_RAM=20480
CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0
KV_UNIFIED=1

# ── GPU Offload ─────────────────────────────────────────────────────────────
NGL=99
FLASH_ATTN=1

# ── Sampling (matched to DavidAU tune for clean A/B) ────────────────────────
TEMP=0.6
TOP_P=0.95
TOP_K=20

# ── Reasoning / Thinking ────────────────────────────────────────────────────
REASONING=on
REASONING_BUDGET=-1

# ── Server ──────────────────────────────────────────────────────────────────
HOST=0.0.0.0
PORT=40801
API_KEY=ollama-local
TIMEOUT=3600
THREADS=32

# ── I/O & Memory ────────────────────────────────────────────────────────────
NO_MMAP=1
DIO=1

# ── Template ────────────────────────────────────────────────────────────────
JINJA=1

# ── Extra ───────────────────────────────────────────────────────────────────
EXTRA_ARGS="--min-p 0.0 -ub 512 -b 2048"
