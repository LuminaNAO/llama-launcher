# Tune: 64gb-q4-262k-coding-v1
# Per-model config for: Qwen3.6-27B-MTP (hybrid Gated-DeltaNet + Gated-Attention,
# trained with multi-token prediction). Tuned for coding / agentic tasks.
# Source: https://huggingface.co/unsloth/Qwen3.6-27B-MTP-GGUF
# Target: Strix Halo / AMD Ryzen AI Max+ 395 — 64 GB unified
# Backend: rocm or vulkan mainline; MTP is enabled by runtime flags
#
# Mainline llama.cpp now contains the MTP runtime; use the normal rocm or vulkan build.
# Quant: UD-Q4_K_XL — chosen on perf evidence, not just memory:
#   Local Q4+MTP vs identical-hardware Q8-no-MTP (<private-ip>) benchmark
#   2026-05-15 showed ~2× generation speedup across short→64k context, and
#   ~2.7× on short context (21.6 vs 7.8 tok/s).
#   Going to BF16 on 64 GB is not viable (52 GB weights alone).
#
# VRAM footprint at 262144 ctx, q4_0 KV with rotor activation rotation:
#   Weights (UD-Q4_K_XL):                  16.4 GB
#   Attention KV (16 of 65 layers, q4_0):   4.35 GB
#   DeltaNet recurrent state:               0.4 GB
#   MTP draft context (q4_0):               0.3 GB
#   Compute buffers:                        1.4 GB
#   ──────────────────────────────────────
#   Total live: ~23 GB
#
# Why q4_0 KV is safe here: rotor (Walsh-Hadamard activation rotation,
# PRs #21038/#21513/#21352, auto-engaged when head_dim % 64 == 0) smooths
# the value distribution before quantization, closing the q4_0 vs q8_0
# quality gap on this arch (head_dim=256 ✅). Verify with `attn_rot_k = 1`
# in the load log. Disable with LLAMA_ATTN_ROT_DISABLE=1 if needed.
#
# This fits comfortably on the smallest plausible Strix Halo VRAM split
# (32 GB) with ~9 GB headroom. On wider splits (50+ GB VRAM) you have
# 25+ GB headroom for cache_ram-backed prefix caching.
#
# Sampling: HF card's "Thinking mode for precise coding tasks (e.g. WebDev)"
#   temp=0.6, top_p=0.95, top_k=20  (same as 128gb tune)
#
# Differences from the 128gb-bf16 tune:
#   - Quant: BF16 → UD-Q4_K_XL (perf reason above; not just memory)
#   - CACHE_RAM: 40960 → 16384 (16 GiB ceiling — Strix Halo UMA shares the
#     unified pool with the GPU; a high cache ceiling on a 64 GB box can
#     compete with model+KV. 16 GiB is generous given Q4's small footprint.)
#   - CHECKPOINT_MAX: 64 → 32 (each checkpoint ≈ 200 MB at this arch;
#     32 × 200 MB ≈ 6 GB of checkpoint state, half of 128gb's budget.)

# ── Context & Scheduling ────────────────────────────────────────────────────
CONTEXT=262144
PARALLEL=1

# ── KV Cache ────────────────────────────────────────────────────────────────
# q4_0 K/V with rotor activation rotation (auto-engaged: head_dim=256).
# Rotor support is in current mainline llama.cpp.
CACHE_RAM=16384
CACHE_TYPE_K=q4_0
CACHE_TYPE_V=q4_0
KV_UNIFIED=1

# ── Checkpoints ─────────────────────────────────────────────────────────────
CHECKPOINT_INTERVAL=4096
CHECKPOINT_MAX=32

# ── GPU Offload ─────────────────────────────────────────────────────────────
NGL=99
FLASH_ATTN=1

# ── Sampling (HF: Thinking for precise coding) ──────────────────────────────
TEMP=0.6
TOP_P=0.95
TOP_K=20

# ── Server ──────────────────────────────────────────────────────────────────
HOST=0.0.0.0
PORT=40801
API_KEY=ollama-local
TIMEOUT=3600

# ── I/O & Memory ────────────────────────────────────────────────────────────
NO_MMAP=1
DIO=1

# ── Template / Reasoning ────────────────────────────────────────────────────
# JINJA=1 (launcher default) is needed for Qwen3's chat template / tool calls.
# Reasoning=auto picks up the thinking block from the embedded template.

# ── MTP speculative decoding ────────────────────────────────────────────────
# Mainline flag name: use `draft-mtp`.
EXTRA_ARGS="--spec-type draft-mtp --spec-draft-n-max 2"
