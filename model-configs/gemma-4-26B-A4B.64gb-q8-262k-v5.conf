# Tune: 64gb-q8-262k-v5
# Per-model config for: gemma-4-26B-A4B-it (Q8_0/Q6_K_XL, MoE 128 experts / 8 active)
# Target: 64 GB system, HARD CEILING 50 GB
# Verified: 2026-04-09 soak test (1 hour, 12 waves) — peak GTT 30,772 MB
#
# REQUIRES: llama.cpp build >= b8763 (ff5ef8278 or later)
#   Critical fixes since b8733:
#   - d7ff074c8: reasoning budget sampler was BROKEN — thinking start/end tags
#     were never set for Gemma 4, so REASONING_BUDGET did nothing in v1-v4
#   - ddf03c6d9: ambiguous grammar rule in tool call dict key parsing
#   - 3fc65063d: auto-detect updated vs old Gemma 4 templates
#   - 0ec191e1d: tokenizer byte-fallback edge case fix
#   - 057dba336: multimodal padding token scaling fix (vision)
#   - e62fa13c2: shared-KV tensor loading more permissive
#
# Architecture: Gemma 4 MoE with Sliding Window Attention
#   - 30 layers: 25 SWA (window=1024) + 5 full attention (layers 5,11,17,23,29)
#   - Full attn layers: 2 KV heads, head_dim=512
#   - SWA layers: 8 KV heads, head_dim=256, window=1024 (fixed cost)
#   - 128 experts, 8 active per token (26B total, ~4B active)
#   - Context: 262144 native
#   - Thinking model: uses <|channel>thought tags (peg-gemma4 template)
#
# v5 changes vs v4:
#   - TEMP 1.0 → 1.5: community reports better coding output at higher temp.
#     Google default is 1.0 but repeat loops still occur. Testing 1.5 as
#     alternative to DRY/repeat penalties. If quality degrades, revert to 1.0
#     and enable DRY_MULTIPLIER=0.8 instead.
#   - JINJA explicitly disabled: use peg-gemma4 native parser to avoid jinja
#     template bugs with tool schemas (#21347 upper filter on arrays, #21384
#     array parameter serialization). The native parser is purpose-built for
#     Gemma 4's tool calling format.
#   - DRY_MULTIPLIER=0.8 enabled: light DRY as safety net against repeat loops
#     that persist even at higher temperatures. DRY_PENALTY_LAST_N=256 limits
#     the window to avoid over-penalizing in long 262K contexts.
#   - CACHE_RAM 8192 → 4096: 8 GB was excessive, 4 GB covers system prompts.
#   - CHECKPOINT_MAX 20 → 12: checkpoint size varies by quant (265 MiB on
#     Q6_K_XL/ROCm vs 159 MiB on Q8_0/Vulkan). 12 keeps worst case ~3.1 GB.
#   - Build updated: reasoning budget now actually works (was silently broken
#     in b8733 — thinking tags were never set for Gemma 4).
#   - REMOVED --samplers override from EXTRA_ARGS: it was replacing the entire
#     sampler chain and silently removing DRY from the pipeline.
#
# Identity confusion notes (for agent/group chat use):
#   - MoE 26B returns empty responses when system prompts exceed ~500 chars
#     (Ollama #15428). Keep system prompts concise or split across messages.
#   - Strip thought blocks from previous turns before feeding back — Google:
#     "the model wasn't explicitly trained with raw thoughts in prompts
#     outside tool-call scenarios." Feeding thoughts back destabilizes roles.
#   - Reinforce identity in both system prompt and first user message.
#
# Measured VRAM (soak test, 2026-04-09, Vulkan Strix Halo):
#   Idle GTT (model loaded):    30,767 MiB (30.0 GB)
#   Peak GTT (1hr concurrent):  30,772 MiB (30.0 GB)
#   GTT delta under load:             5 MiB (flat — fully pre-allocated)
#   Headroom to 50 GB limit:   ~20,428 MiB (20.0 GB)
#
# Checkpoint behavior (from production logs):
#   - Each checkpoint: 159.5 MiB (pos_min/pos_max span + SWA state)
#   - Same-slot sequential: checkpoints reused via LCP match (~0.99 hit rate)
#   - Cross-slot divergence: ALL checkpoints erased, full reprompt from zero
#   - KV_UNIFIED=1 is CRITICAL: without it, slots can't share cached prefixes
#
# Known issues (as of 2026-04-12):
#   - Vulkan: <unused> token loops (#21516) — OPEN
#   - Server infinite output (#21365) — OPEN, backend-agnostic
#   - Tool call array serialization (#21384) — OPEN (mitigated by JINJA=0)
#   - Cache reuse broken for shared-KV models (#21468) — PR #21749 pending
#   - Tool calls: use parallel_tool_calls=false to prevent loops (#21375)
#
# Vision: mmproj available, enable at launch prompt

# ── Context & Scheduling ────────────────────────────────────────────────────
CONTEXT=262144
PARALLEL=2

# ── KV Cache ────────────────────────────────────────────────────────────────
# KV_UNIFIED is critical for SWA models — lets slots share cached prefixes.
# Without it, every slot switch forces a full reprompt from zero.
# CACHE_RAM enables shared prompt caching (system prompt reuse across requests).
# 4 GB is enough for large system prompts + tool definitions across both slots.
CACHE_RAM=102400
CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0
KV_UNIFIED=1

# ── Checkpoints ─────────────────────────────────────────────────────────────
# Each checkpoint = 159.5 MiB (measured). Only useful for same-slot sequential
# requests — SWA invalidates all checkpoints on cross-slot context divergence.
# Checkpoint size varies by quant: 159.5 MiB (Q8_0/Vulkan), 265.6 MiB (Q6_K_XL/ROCm).
# At worst case: 12 × 265.6 = ~3.1 GB pre-allocated.
CHECKPOINT_INTERVAL=8192
CHECKPOINT_MAX=12

# ── GPU Offload ─────────────────────────────────────────────────────────────
NGL=99
FLASH_ATTN=1

# ── Sampling ────────────────────────────────────────────────────────────────
# Testing temp=1.5 for coding tasks (community reports better than 1.0).
# Google default is 1.0. If quality degrades, revert to 1.0 and rely on DRY.
TEMP=1.5
TOP_P=0.95
TOP_K=64

# ── Reasoning / Thinking ────────────────────────────────────────────────────
# Force thinking on: with many tools, Gemma 4 skips the thinking phase in
# auto mode. Forcing it on ensures reasoning_content is always populated.
# NOTE: reasoning budget was silently broken before b8763 — now works.
REASONING=on
REASONING_BUDGET=8192

# ── Anti-repeat ─────────────────────────────────────────────────────────────
# DRY enabled as safety net against repeat loops. Light multiplier (0.8) with
# limited window (256 tokens) to avoid over-penalizing in long contexts.
# If temp=1.5 eliminates loops on its own, these can be commented out.
DRY_MULTIPLIER=0.8
DRY_BASE=1.75
DRY_ALLOWED_LENGTH=2
DRY_PENALTY_LAST_N=256
# REPEAT_PENALTY=1.05
# REPEAT_LAST_N=256
# PRESENCE_PENALTY=0.0
# FREQUENCY_PENALTY=0.0

# ── Server ──────────────────────────────────────────────────────────────────
HOST=0.0.0.0
PORT=40801
API_KEY=ollama-local
TIMEOUT=3600
THREADS=32

# ── I/O & Memory ────────────────────────────────────────────────────────────
NO_MMAP=1
DIO=1

# ── Template ────────────────────────────────────────────────────────────────
# Use peg-gemma4 native parser — avoids jinja bugs with tool schemas
# (#21347 upper filter on arrays, #21384 array parameter serialization)
JINJA=0

# ── Extra ───────────────────────────────────────────────────────────────────
# DO NOT use --samplers override — it replaces the entire chain and removes
# DRY from the pipeline even if DRY_MULTIPLIER is set.
# EXTRA_ARGS=""
