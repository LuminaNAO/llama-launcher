kind: llama-launcher-tune
version: 1
name: "32gb-cuda-5090-gsq3s-262k-v1"
model: "Qwen3.8"
metadata:
  shareable: true
  notes: |-
    Tune: 32gb-cuda-5090-gsq3s-262k-v1   (PRODUCTION — consolidated 2026-09-05)
    Per-model config for: ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF
      file  Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp.gguf  12.12 GB / 11.3 GiB, 3.50 bpw
      mmproj-Qwen3.8-27B-BF16.gguf (0.93 GB), same repo. HF LFS sha256 verified.
    Target: RTX 5090, 32 GiB VRAM, CUDA0, Blackwell sm_120. Host 62 GB.
    This single tune replaces the v1/v2/v3 series from the 2026-09-04/05
    screen and sweep; the history is in git. Every setting below is measured.

    WHAT IT IS: stock Qwen3.8-27B (not a finetune, not decensored) quantised
    with GSQ (Gumbel-Softmax: learned grid + per-group scales) and RCO
    (Riemannian constrained per-tensor type allocation). -mtp carries the
    MTP head (blk.64, Q6_K). Hybrid qwen35 arch: full attention every 4th
    layer (16 of 65, 4 KV heads, head dim 256), the rest Gated DeltaNet.

    WHY IT REPLACED HIGHEST (NVFP4-MTP), same-day screen, fresh FreeClaw,
    --thinking high: Rust gauntlet 4/5 (clears R3+R5, the separators HIGHEST
    fails; R1 miss stochastic, passes on retry) vs HIGHEST 3/5. Decode 133
    t/s shallow code / 85 @201k vs HIGHEST 90 / 77. Prefill ~20% behind
    HIGHEST (6.3k vs 7.9k @62k — IQ3 dequant vs native NVFP4). VRAM 20.9
    GiB served vs 28.4. Probes (3-switch, lifetime bug, cron.d, marbles)
    correct; 4-turn test no truncation. DavidAU TURBO 735-882 screened the
    same day: 3/5, rushes, not adopted.

    SETTINGS, EACH FROM MEASUREMENT:
    * --spec-type draft-mtp, depth 3: sweep (fixed seed, byte-identical
      outputs across variants) d2 134.1 / d3 150.4 / d4 149.5 / d5 145.1
      mean decode t/s over code/reason/edit probes. p-split 0.05/0.20 no
      effect. draft-mtp,ngram-mod +2% (edit probe only) — not adopted,
      untested at depth; ngram-map-k4v hurts code. Acceptance 0.36-0.54
      shallow, 0.93 on copy-heavy edits.
    * KV q4_0 both halves. This build Hadamard-rotates Q/K/V before the
      cache (upstream #21038, automatic for quantized KV, head dim %64), so
      q4_0 has the outlier fix. Measured on THIS gguf, wikitext-2 test:
                   c=32768 (8 chunks)      c=65536 (4 chunks)
          f16      6.5896 +/- 0.0445       5.9021 +/- 0.0384
          q8_0     6.5845 +/- 0.0445       5.9022 +/- 0.0384
          q4_0     6.5925 +/- 0.0445       5.9114 +/- 0.0385
      q4_0 is +0.04% / +0.16% from f16, inside the error bars. Needle
      retrieval (6 planted facts at 5%..95% depth of a wikitext haystack):
      q4_0 6/6, q8_0 6/6 — indistinguishable (needle_kv_ab.py). NB the
      haystack tokenised to ~310k, past n_ctx, and the server context-
      shifted to 155k resident tokens (log: "stop processing: n_tokens =
      155092") — so the test covered ~155k of attention KV plus recurrent-
      state recall of the earlier part (the 5% fact was still recalled:
      Gated DeltaNet layers keep a summary of everything seen). q8_0 had
      cost -3% deep decode and +4 GiB for nothing. Upstream caveat noted:
      on gpt-oss-20b rotated q4_0 still trailed q8_0 on AIME25; not seen
      here. PPL beyond 64k is not measurable with llama-perplexity on a
      62 GB host (n_ctx x n_vocab host logits buffer -> OOM at 128k).
    * Checkpoints: MIN_STEP 16384 x MAX 16 = exact 262144 coverage, and ALL
      16 persisted to the sidecar (SLOT_SAVE_MAX_CHECKPOINTS 16), so every
      restore point survives a session switch. Cost measured live: 150 MiB
      + 4.02 KiB/token per checkpoint, in HOST RAM (not VRAM), identical at
      q4_0 and q8_0 (mostly recurrent state on this arch). Per-token cost
      scales with ctx x MAX/2, so fewer, sparser checkpoints is the lever:
        8192 x 32   21.3 GiB   rollback <= 8k tok (~2 s)
        16384 x 16  10.9 GiB   rollback <= 16k tok (~3-4 s)   <- chosen
        32768 x 8    5.7 GiB   rollback <= 32k tok (~6-8 s)
        4096 x 64   ~42 GiB    does not fit the 62 GB host
      Chosen 2026-09-05 over 8192x32 + deepest-16 sidecar: that layout left
      a restored session with no restore point below ~131k, so a shallow
      divergence (what harness compaction produces) re-prefilled up to
      ~35 s; this one bounds rollback at ~3-4 s at any depth, halves host
      RAM (~13 GiB steady / ~18 peak at 262k), and shrinks the per-session
      slot-cache footprint to ~15.7 GiB (KV .bin ~4.8 + sidecar ~10.9) —
      ~11 max-depth sessions under the 180 GB LRU cap on the root NVMe
      (~2 GB/s; ~8 s save or restore at max depth). Steps are multiples of
      the 2048 batch.
    * -b 2048 -ub 512: -ub 1024 gave no prefill gain (6081 vs 6266 @62k).
    * mmproj on GPU: image test 1.4 s vs 9.5 s CPU-side; VRAM allows it.
    * Template: qwen38-froggeric-fixed.jinja (bare name; the launcher
      resolves it against the model-config dirs). Same bytes as production
      has run since August (sha256 e4d49554...). reasoning_effort xhigh.
    * Samplers per Qwen3.8 thinking card: temp 1.0, top-p 0.95, top-k 20,
      min-p 0. Exact decoding: spec depth and -ub do not change outputs.

    VERIFIED AT LAUNCH: ~20.9 GiB used / ~11 GiB free; smoke 163 t/s; 87 t/s
    decode @200k; 0 Xid. RC watchdog notify timeout is 60 s on this box
    (utils/set-rc-watchdog-timeout.sh). Running-config snapshot:
    snapshots/2026-09-05-gsq3s-*.

    LOW SYSTEM-RAM HOSTS: use gsq3s-262k-lowram-v1 (same VRAM config and
    speed; checkpoints 65536 x 4, ~4 GiB host worst case). Measured host
    floor here is 1.64 GiB RSS with 0 checkpoints; a long prefill creates
    one checkpoint at its end, they accumulate across turns up to MAX.

    OPERATING NOTES: at xhigh the model routinely thinks >4k tokens — a
    direct-API cap under ~16k looks like an empty reply. Community (HF #7):
    IQ3_S over IQ3_XXS; calibration ~90% English. Follow-ups: draft-mtp,
    ngram-mod at deep context; DFlash2 drafter once PR #27342 lands in
    llama-hdd.
settings:
  RECOMMENDED_BACKEND: "cuda"
  API_KEY: "ollama-local"
  CACHE_RAM: "0"
  CACHE_TYPE_K: "q4_0"
  CACHE_TYPE_V: "q4_0"
  CHECKPOINT_MAX: "16"
  CHECKPOINT_MIN_STEP: "16384"
  SLOT_SAVE_MAX_CHECKPOINTS: "16"
  CONTEXT: "262144"
  DIO: "1"
  HDD_CACHE: "1"
  EXTRA_ARGS: "--spec-type draft-mtp --spec-draft-n-max 3 -b 2048 -ub 512 --min-p 0 --image-min-tokens 1024 --chat-template-file qwen38-froggeric-fixed.jinja --reasoning-format deepseek --chat-template-kwargs {\"reasoning_effort\":\"xhigh\"}"
  FLASH_ATTN: "1"
  HOST: "0.0.0.0"
  KV_UNIFIED: "1"
  MAX_TOTAL_SLOTS_GB: "180"
  MIN_FREE_GB: "80"
  NGL: "999"
  NO_MMAP: "0"
  PARALLEL: "1"
  PORT: "40801"
  TEMP: "1.0"
  TIMEOUT: "3600"
  TOP_K: "20"
  TOP_P: "0.95"
