kind: llama-launcher-tune
version: 1
name: "128gb-q8-131k-v1"
model: "gemma-4-26B-A4B-it-Claude-Opus-Distill"
metadata:
  shareable: true
  notes: |-
    Tune: 128gb-q8-131k-v1
    Per-model config for: gemma-4-26B-A4B-it-Claude-Opus-Distill (Q8_0, MoE 128/8)
    Claude Opus 4.6 reasoning distillation by TeichAI. SFT on ~4K samples of
    high-effort Claude reasoning trajectories. v1 — note v2 is recommended
    by the author (better generalization, chat template fixes).
    Target: 128 GB system, ~100 GB ceiling
    Architecture: Gemma 4 MoE with Sliding Window Attention
    - 30 layers: 25 SWA (window=1024) + 5 full attention
    - 128 experts, 8 active per token (26B total, ~4B active)
    - Context: 131072 (agents auto-compact at ~131K)
    Memory budget estimate (131K, 1 slot):
    Model weights (Q8_0):        ~27.0 GB
    KV cache (1 slot × 131K):     ~1.4 GB
    CACHE_RAM ceiling (RAM, spills to swap — see docs/CACHE-RAM.md):     30.0 GB
    Checkpoints (76 × 265 MiB): ~19.7 GB
    Compute buffers:              ~2.5 GB
    Estimated total:             ~81.0 GB
    Headroom to 100 GB limit:   ~19.0 GB
    Model card recommended sampling: temp=1.0, top_p=0.95, top_k=64
    Stress test results (b8783, parallel_tool_calls=true, Q8_0, PEG):
    100% pass, all 3 tools, baseline through 120K (62K prompt tokens)
    Very consistent: exactly 65 completion tokens per tool call response
    Quality comparison vs stock Gemma 4:
    - More concise responses (513 tokens vs 2265 stock)
    - Tends to skip reasoning/thinking phase and go straight to response
    - Clean structured output with tables and edge case documentation
    - Faster response time (~15s vs ~62s stock)
    PARALLEL=1: SWA checkpoint invalidation with >1 slot (#21468)
    Same thinking format as base Gemma 4: <|channel>thought...<channel|>
    DRY OFF: breaks tool call emission. Not needed at temp=1.0.
    DRY_MULTIPLIER=0.8
    DRY_BASE=1.75
    DRY_ALLOWED_LENGTH=2
    DRY_PENALTY_LAST_N=512
    EXTRA_ARGS=""
settings:
  API_KEY: "ollama-local"
  CACHE_RAM: "30720"
  CACHE_TYPE_K: "q8_0"
  CACHE_TYPE_V: "q8_0"
  CHECKPOINT_MAX: "76"
  CONTEXT: "131072"
  DIO: "1"
  FLASH_ATTN: "1"
  HOST: "0.0.0.0"
  JINJA: "0"
  KV_UNIFIED: "1"
  NGL: "99"
  NO_MMAP: "1"
  PARALLEL: "1"
  PORT: "40801"
  REASONING: "on"
  REASONING_BUDGET: "8192"
  TEMP: "1.0"
  THREADS: "32"
  TIMEOUT: "3600"
  TOP_K: "64"
  TOP_P: "0.95"
