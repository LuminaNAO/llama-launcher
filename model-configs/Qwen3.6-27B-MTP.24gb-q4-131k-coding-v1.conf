# Tune: 24gb-q4-131k-coding-v1
# Per-model config for: Qwen3.6-27B-MTP (hybrid Gated-DeltaNet + Gated-Attention,
# trained with multi-token prediction). Tuned for coding / agentic tasks.
# Source: https://huggingface.co/unsloth/Qwen3.6-27B-MTP-GGUF
# Target: AMD RX 7900 XTX (24 GB discrete, gfx1100 / RDNA 3) in a 64 GB host
# Backend: rocm-mtp  (am17an/llama.cpp:mtp-clean — upstream PR #22673 fork)
# Quant: UD-Q4_K_XL — chosen on perf evidence (2026-05-15 bench on gfx1151
#   showed Q4+MTP is 1.2× faster than Q8+MTP and 2× faster than no-MTP at all
#   ctx sizes). Same trade-off applies here — memory-bandwidth-bound generation
#   benefits from smaller weights.
#
# REQUIRES: rocm-mtp build (see repo README). On the target system:
#   git clone -b mtp-clean https://github.com/am17an/llama.cpp.git \
#       ~/code/llama-mtp/llama.cpp
#   LLAMACPP_SRC=~/code/llama-mtp/llama.cpp ./build.sh rocm-mtp
#   # The build.sh picker auto-detects gfx1100 via rocminfo.
#
# Architecture (recap, from HF model card):
#   - 27B params, 64 layers in a hybrid pattern:
#       16 × [ 3 × (Gated-DeltaNet → FFN)  +  1 × (Gated-Attention → FFN) ]
#     Only ¼ of layers (16) carry full quadratic KV; the other 48 are
#     linear-state DeltaNet with bounded recurrent state.
#   - Gated Attention: 24 Q heads / 4 KV heads, head_dim=256, RoPE dim=64
#   - Native ctx: 262144 (we run 131072 here for VRAM headroom — see below).
#
# VRAM math at 131072 ctx, q4_0 KV with rotor, -ub 256 -b 1024:
#   Weights (UD-Q4_K_XL):                  16.4 GB
#   Attention KV (16 layers, q4_0 @ 131k):  2.18 GB
#   DeltaNet recurrent state:               0.4 GB
#   MTP draft context (q4_0):               0.15 GB
#   FA + compute scratch @ -ub 256:         ~1.8 GB
#   ──────────────────────────────────────
#   Total VRAM: ~20.9 GB → ~3 GB headroom on 24 GB 7900 XTX.
#
# Why -ub 256: on gfx1100, FA compute scratch at the default -ub 512 is
# empirically ~3.6 GB (per the existing NEO-CODE 24gb conf in this repo).
# Combined with MTP's draft pass which ALSO needs FA scratch on top of the
# main model's, default ub OOMs the first request — observed on 2026-05-15.
# -ub 256 halves the scratch and matches what the NEO-CODE conf settled on.
# If you still OOM, drop further: EXTRA_ARGS="... -ub 128 -b 512".
#
# Why 131k and not 262k:
#   At 262k the KV doubles to 4.35 GB → total ~23 GB even with -ub 256.
#   No headroom for the desktop compositor on the same GPU. 131k is the
#   production-safe choice. Headless or with --context 262144 + careful
#   monitoring is possible.
#
# CACHE_RAM 40 GiB: lives in the 64 GB SYSTEM RAM (not VRAM) — separate pool
# from the GPU. Generous so long agentic sessions keep deep prefix cache.
#
# Sampling: HF card's "Thinking mode for precise coding tasks (e.g. WebDev)"
#   temp=0.6, top_p=0.95, top_k=20 — same as the Strix Halo tunes.

# ── Context & Scheduling ────────────────────────────────────────────────────
CONTEXT=131072
PARALLEL=1

# ── KV Cache ────────────────────────────────────────────────────────────────
# q4_0 K/V with rotor activation rotation (auto-engaged: head_dim=256).
# Rotor PRs #21038/#21513/#21352 are in the mtp-clean fork (b9149+) and
# close the q4_0 vs q8_0 quality gap. Halves KV memory + halves KV
# bandwidth per attention step.
#
# CACHE_RAM lives in system RAM (separate from 24 GB VRAM). 64 GB system
# means we can be generous — 40 GiB ceiling for prefix reuse, real usage
# self-shrinks under pressure.
CACHE_RAM=40960
CACHE_TYPE_K=q4_0
CACHE_TYPE_V=q4_0
KV_UNIFIED=1

# ── Checkpoints ─────────────────────────────────────────────────────────────
# 64 checkpoints × ~180 MB each ≈ 11 GB of system RAM at full ctx — fine
# given 64 GB host. Each checkpoint is a chance to skip prefill on small
# edits, which is exactly the coding/agentic workload.
CHECKPOINT_INTERVAL=4096
CHECKPOINT_MAX=64

# ── GPU Offload ─────────────────────────────────────────────────────────────
NGL=99
FLASH_ATTN=1

# ── Sampling (HF: Thinking for precise coding) ──────────────────────────────
TEMP=0.6
TOP_P=0.95
TOP_K=20

# ── Server ──────────────────────────────────────────────────────────────────
HOST=0.0.0.0
PORT=40801
API_KEY=ollama-local
TIMEOUT=3600

# ── I/O & Memory ────────────────────────────────────────────────────────────
NO_MMAP=1
DIO=1

# ── Template / Reasoning ────────────────────────────────────────────────────
# JINJA=1 (launcher default) is needed for Qwen3's chat template / tool calls.
# Reasoning=auto picks up the thinking block from the embedded template.

# ── MTP speculative decoding + ub clamp ─────────────────────────────────────
# --spec-type draft-mtp: card says `mtp`, mtp-clean branch wants `draft-mtp`.
# -ub 256 -b 1024: REQUIRED on gfx1100 — see header for the FA-scratch math.
EXTRA_ARGS="--spec-type draft-mtp --spec-draft-n-max 2 -ub 256 -b 1024"
