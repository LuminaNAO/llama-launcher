# Tune: gemma4-31b-128gb-vulkan
# Gemma 4 31B Q6_K_L — 128GB system, Vulkan backend
# Dense model with iSWA (interleaved sliding window attention)
#
# Hardware: Strix Halo (Radeon 8060S, Vulkan, shared RAM)
# Budget: 90 GB max (leaves headroom for OS + ComfyUI + etc)
# Build: vulkan
#
# NOTE: ROCm gfx1151 is significantly faster — use gemma4-31b-128gb-rocm if possible
#
# ── Memory Budget ────────────────────────────────────────────────────────────
#   Model weights (Q6_K_L, Vulkan):  25,799 MB
#   Model weights (CPU layers):       1,428 MB
#   mmproj (vision):                  1,200 MB
#   Fixed total:                     28,427 MB (27.8 GB)
#
#   KV cache (131K ctx, q8_0) x2:   10,854 MB (42.5 KB/tok x 2 slots)
#   16 checkpoints x 638 MB:        10,200 MB
#   Cache-RAM:                       20,480 MB
#   ─────────────────────────────────────────
#   Estimated total:                 69,961 MB (68.3 GB)
#   Cache save peak:                 +6,724 MB (transient at 131K)
#   Estimated peak:                  76,685 MB (74.9 GB)
#   Headroom:                        15,315 MB (15.0 GB)
#
# ── Test Results (2026-04-07) ────────────────────────────────────────────────
#   Method: raw HTTP stress test (large code review payloads)
#   Phase 1: 51,744 prompt tokens, 342s, RAM stable 59-61 GB
#   Turn 1: 67,619 prompt tokens, 515s, RAM stable 59-61 GB
#   Turn 2: 83,033 prompt tokens, 919s, RAM 61 GB
#   Turn 3: server crashed at 87K tokens (connection closed)
#   Prompt processing: 116-150 tok/s
#   Generation: 5.8-8 tok/s single slot, 3-4 tok/s parallel
#   Verdict: NEEDS REVIEW — crashed at 87K, may need fewer checkpoints
#
# ── Known Issues ─────────────────────────────────────────────────────────────
#   - Gemma 4 cache reuse broken upstream (llama.cpp #21468)
#   - Jinja parser stack overflow — use JINJA=0, peg-gemma4 works
#   - --flash-attn requires explicit value: --flash-attn on
#
# ── Cost Matrix (for custom tuning) ──────────────────────────────────────────
#   KV per token (q8_0): 42.5 KB    KV per token (q4_0): 21.3 KB
#   Cache save peak:     52.6 KB/tok (transient during save)
#   Checkpoint:          637.5 MB each
#   Formula: TOTAL = 28.4 + (CTX * KV_KB / 1024^2) + (CP * 0.623) + CACHE_GB
#
# For 64GB systems see google_gemma-4-31B-it.64gb.conf

CONTEXT=131072
PARALLEL=2
CACHE_RAM=20480
CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0
KV_UNIFIED=1
CHECKPOINT_INTERVAL=4096
CHECKPOINT_MAX=16

# ── GPU Offload ─────────────────────────────────────────────────────────────
NGL=99
FLASH_ATTN=1

# ── Sampling ────────────────────────────────────────────────────────────────
TEMP=0.3
TOP_P=0.95
TOP_K=20

# ── Anti-repeat ─────────────────────────────────────────────────────────────
# Uncomment to enable anti-repeat sampling.
# DRY_MULTIPLIER=0.0
# DRY_BASE=1.75
# DRY_ALLOWED_LENGTH=2
# DRY_PENALTY_LAST_N=-1
# REPEAT_PENALTY=1.0
# REPEAT_LAST_N=64
# PRESENCE_PENALTY=0.0
# FREQUENCY_PENALTY=0.0

# ── Reasoning / Thinking ────────────────────────────────────────────────────
# REASONING=auto
# REASONING_BUDGET=-1

# ── Server ──────────────────────────────────────────────────────────────────
HOST=0.0.0.0
PORT=40801
API_KEY=ollama-local
TIMEOUT=3600
THREADS=32

# ── I/O & Memory ────────────────────────────────────────────────────────────
NO_MMAP=1
DIO=1

# ── Template ────────────────────────────────────────────────────────────────
# Disable --jinja: Gemma 4 chat template triggers std::regex stack overflow
# in llama.cpp's Jinja parser. The native peg-gemma4 parser works without it.
JINJA=0

# ── Extra ───────────────────────────────────────────────────────────────────
# EXTRA_ARGS=""
