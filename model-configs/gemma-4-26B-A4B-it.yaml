kind: llama-launcher-tune
version: 1
name: "gemma-4-26B-A4B-it"
model: "gemma-4-26B-A4B-it"
metadata:
  shareable: true
  notes: |-
    Per-model config for: gemma-4-26B-A4B (all quants)
    Gemma 4 26B MoE (4B active) with iSWA
    MoE variant — 4B active per token, should be faster than the 31B dense.
    Model weights: ~26 GB (Q8_0) — lighter than Qwen so more headroom.
    Context capped to 262k (model training limit).
    Uncomment to enable anti-repeat sampling.
    DRY_MULTIPLIER=0.0
    DRY_BASE=1.75
    DRY_ALLOWED_LENGTH=2
    DRY_PENALTY_LAST_N=-1
    REPEAT_PENALTY=1.0
    REPEAT_LAST_N=64
    PRESENCE_PENALTY=0.0
    FREQUENCY_PENALTY=0.0
    REASONING=auto
    REASONING_BUDGET=-1
    Disable --jinja: Gemma 4 chat template triggers std::regex stack overflow
    in llama.cpp's Jinja parser. The native peg-gemma4 parser works without it.
    EXTRA_ARGS=""
settings:
  API_KEY: "ollama-local"
  CACHE_RAM: "30720"
  CACHE_TYPE_K: "q8_0"
  CACHE_TYPE_V: "q8_0"
  CHECKPOINT_MAX: "64"
  CONTEXT: "262144"
  DIO: "1"
  FLASH_ATTN: "1"
  HOST: "0.0.0.0"
  JINJA: "0"
  KV_UNIFIED: "1"
  NGL: "99"
  NO_MMAP: "1"
  PARALLEL: "2"
  PORT: "40801"
  TEMP: "0.3"
  THREADS: "32"
  TIMEOUT: "3600"
  TOP_K: "20"
  TOP_P: "0.95"
