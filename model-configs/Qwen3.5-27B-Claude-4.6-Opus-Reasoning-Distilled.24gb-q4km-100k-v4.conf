# Tune: 24gb-q4km-100k-v4
# Per-model config for: Qwen3.5-27B-Claude-4.6-Opus-Reasoning-Distilled (Q4_K_M)
# Claude Opus 4.6 reasoning distillation by Jackrong.
# Target: 24 GB GPU (ROCm)
#
# v4 changes from v3:
#   - TEMP 0.7 → 0.3: v3 temp was too high, caused garbled identifiers
#     in multi-turn tool conversations (reqbody, pooquery, titl, reatlt)
#   - TOP_K 40 → 20: tighter sampling for code accuracy
#   - DRY disabled: was penalizing legitimate code repetition (req., res.,
#     pool.query, result.rows) — root cause of garbled output
#   - REPEAT_PENALTY disabled: same issue as DRY for code
#   - JINJA commented out: remote server runs fine without it
#   - REASONING settings commented out: let server defaults handle it
#
# Architecture: Qwen3.5 hybrid SSM/attention (Gated Delta Net)
#   - 64 layers total, only 16 use KV cache
#   - ~34 MB/1K tokens at q8_0
#   - Context: capped to ~100K for 24GB GPU
#
# VRAM breakdown at ~113K context:
#   Model weights (Q4_K_M):  15,082 MiB
#   KV cache (q8_0, 16 layers): ~3,750 MiB
#   SSM recurrent state (f32):    150 MiB
#   Checkpoints (4x ~115 MiB):    460 MiB
#   Compute buffers:               495 MiB
#   Total GPU:                  ~19,937 MiB (~19.5 GB)
#   Headroom on 24 GB:           ~4.5 GB

# ── Context & Scheduling ────────────────────────────────────────────────────
CONTEXT=113200
PARALLEL=1

# ── KV Cache ────────────────────────────────────────────────────────────────
CACHE_RAM=0
CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0
KV_UNIFIED=1

# ── Checkpoints ─────────────────────────────────────────────────────────────
CHECKPOINT_INTERVAL=8192
CHECKPOINT_MAX=4

# ── GPU Offload ─────────────────────────────────────────────────────────────
NGL=99
FLASH_ATTN=1

# ── Sampling ────────────────────────────────────────────────────────────────
TEMP=0.3
TOP_P=0.95
TOP_K=20

# ── Anti-repeat ─────────────────────────────────────────────────────────────
# Disabled — DRY and repeat_penalty corrupt code in multi-turn tool
# conversations by penalizing common patterns like req., res., pool.query
# DRY_MULTIPLIER=0.0
# REPEAT_PENALTY=1.0

# ── Reasoning / Thinking ────────────────────────────────────────────────────
# REASONING=auto
# REASONING_BUDGET=-1

# ── Server ──────────────────────────────────────────────────────────────────
HOST=0.0.0.0
PORT=40801
API_KEY=ollama-local
TIMEOUT=3600
THREADS=32

# ── I/O & Memory ────────────────────────────────────────────────────────────
NO_MMAP=1
DIO=1

# ── Template ────────────────────────────────────────────────────────────────
# JINJA=1

# ── Extra ───────────────────────────────────────────────────────────────────
# EXTRA_ARGS=""
