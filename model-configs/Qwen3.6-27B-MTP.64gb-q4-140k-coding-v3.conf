# Tune: 64gb-q4-140k-coding-v3
# Per-model config for: Qwen3.6-27B-MTP (hybrid Gated-DeltaNet + Gated-Attention,
# trained with multi-token prediction). Tuned for coding / agentic tasks.
# Source: https://huggingface.co/unsloth/Qwen3.6-27B-MTP-GGUF
# Target: Strix Halo / AMD Ryzen AI Max+ 395 - 64 GB unified
# Backend: rocm-mtp / vulkan-mtp (mtp-clean / post-MTP merge branch)
#
# v3 is v2 with the prompt cache moved out of CACHE_RAM and onto the slot
# save path. The HDD cache sidecar patch persists context checkpoints in
# <slot>.bin.ckpt, so restored slots keep the hybrid/recurrent checkpoint
# list instead of cold-prefilling from token 0 after a prompt switch.
#
# What v3 changes vs v2:
#   - CACHE_RAM 16000 -> 0:
#       do not reserve host RAM for prompt-cache entries. This avoids the
#       64 GB system spending a large resident heap on multi-GB cached
#       prompts/checkpoints.
#   - SLOT_SAVE_PATH enabled by default:
#       slot blobs and .ckpt sidecars are written under the launcher's
#       model-specific namespace. The launcher appends the model basename,
#       so the effective path will be:
#         /mnt/storage/llama-slots/Qwen3.6-27B-UD-Q4_K_XL
#       for the usual Q4_K_XL file.
#
# Operational notes:
#   - Use the launcher with HDD cache and proxy enabled for automatic
#     slot save/restore:
#       ./llama-server-launcher.sh --build rocm-mtp --model ... --tune v3 --hdd-cache --proxy --log
#     If launched interactively, choosing "Tune default" should keep HDD on.
#   - Passing --hdd-cache is recommended for non-interactive launches because
#     the launcher currently treats explicit logging/proxy flags without an
#     explicit HDD flag as "HDD off".
#   - Passing --no-hdd-cache disables the slot save path and leaves CACHE_RAM=0,
#     which is not useful for prompt switching.
#
# Context rationale inherited from v2:
#   CONTEXT=143360 (140k) keeps enough room for observed ~95k coding prompts
#   while avoiding the 262k KV allocation from v1.
#
# RAM footprint at 143360 ctx, q4_0 KV with rotor, CHECKPOINT_MAX=100:
#   Weights (UD-Q4_K_XL):                  16.4 GB
#   Attention KV (16 layers, q4_0):         2.29 GB
#   DeltaNet recurrent state:               0.4 GB
#   MTP draft context (q4_0):               0.14 GB
#   Compute buffers + scratch + proxy:      ~2.4 GB
#   Empirical baseline (extrapolated from Ornstein measurement):
#                                          ~21.6 GB
#   Active-slot checkpoints worst case
#     (100 × ~305 MB at full 140k context): ~30.5 GB
#   ------------------------------------------------
#   Total live RAM at WORST case: ~52 GB → at the 52 GB target
#                  (worst case = saturated 140k prompt, all 100 ckpts
#                   clustered near pos 140k after many task turns)
#   Typical: ~45 GB (95k prompts, smaller per-ckpt, fewer ckpts accumulated)
#
# Per-checkpoint size scales with position (~150 MB at pos 0, ~305 MB at
# pos 140k, slope ~1.1 MB per 1k pos — empirically measured 2026-05-17).
#
# CHECKPOINT_MAX=100 was chosen so the WORST CASE stays inside 52 GB:
# v2 ran MAX=24 because per-prompt size had to be ~8 GB so 2 prompts fit in
# CACHE_RAM=16. With CACHE_RAM=0 in v3 (disk is the cache, capacity is
# effectively unbounded), per-prompt size no longer gates the cache, and
# the freed 16 GB can be redirected to active-slot checkpoint retention.
# More retained checkpoints = wider position coverage = fewer cold prefills
# on within-prompt divergence. With small-task append workloads (the
# 64 GB box's openclaw flow), end-of-task checkpoints cluster near the
# recent end of the prompt; MAX=24 covered only ~3.6k tokens back, while
# MAX=100 covers ~15-30k tokens back depending on task size.
#
# Disk sidecar sizing (per saved prompt, on /mnt/storage/llama-slots):
#   .bin (active state @ 95k):              ~175 MB
#   .bin.ckpt (100 checkpoints @ ~250 MB):  ~25 GB
# So each saved prompt ≈ 25 GB on disk. With /mnt/storage at 244 GB free,
# that's ~9 retained sessions. Keep the path on a filesystem with plenty
# of free space and acceptable write latency.

# -- Context & Scheduling ----------------------------------------------------
CONTEXT=143360
PARALLEL=1

# -- KV Cache ----------------------------------------------------------------
# q4_0 K/V with rotor activation rotation (auto-engaged: head_dim=256).
# No CACHE_RAM: disk-backed slot cache is the source of truth for prompt
# switching. This is intentional for 64 GB systems.
CACHE_RAM=0
CACHE_TYPE_K=q4_0
CACHE_TYPE_V=q4_0
KV_UNIFIED=1

# -- HDD Slot Cache ----------------------------------------------------------
# The launcher namespaces this by model basename before passing
# --slot-save-path to llama-server.
SLOT_SAVE_PATH=/mnt/storage/llama-slots

# -- Checkpoints -------------------------------------------------------------
# Sized so the WORST CASE (saturated 140k prompt with all checkpoints
# clustered at high positions @ ~305 MB each) stays inside 52 GB total RAM.
# See header math. With CACHE_RAM=0 freeing up v2's 16 GB cache budget,
# that's redirected to MAX so the active slot retains more checkpoints —
# directly attacking within-prompt divergence cold PPs. MAX=100 covers
# ~15-30k tokens of recent task history at small-task workload rates.
CHECKPOINT_INTERVAL=4096
CHECKPOINT_MAX=100

# -- GPU Offload -------------------------------------------------------------
NGL=99
FLASH_ATTN=1

# -- Sampling (HF: Thinking for precise coding) ------------------------------
TEMP=0.6
TOP_P=0.95
TOP_K=20

# -- Server ------------------------------------------------------------------
HOST=0.0.0.0
PORT=40801
API_KEY=ollama-local
TIMEOUT=3600

# -- I/O & Memory ------------------------------------------------------------
NO_MMAP=1
DIO=1

# -- Template / Reasoning ----------------------------------------------------
# JINJA=1 (launcher default) is needed for Qwen3's chat template / tool calls.
# Reasoning=auto picks up the thinking block from the embedded template.

# -- MTP speculative decoding ------------------------------------------------
# n-max=2 matches the existing v2 tune and the current Qwen3.6 MTP configs.
EXTRA_ARGS="--spec-type draft-mtp --spec-draft-n-max 2"
