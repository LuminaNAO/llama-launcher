# Tune: gemma4-31b-64gb-rocm
# Gemma 4 31B Q6_K_L — 64GB system, ROCm/HIP backend
# Dense model with iSWA (interleaved sliding window attention)
#
# Hardware: Strix Halo (Radeon 8060S, ROCm gfx1151, shared RAM)
# Budget: 55 GB max (leaves headroom for OS + gateway + whisper)
# Build: rocm (gfx1151)
#
# ── Memory Budget ────────────────────────────────────────────────────────────
#   Model weights (Q6_K_L):           25,799 MB
#   Model weights (CPU layers):        1,428 MB
#   mmproj (vision):                   1,200 MB
#   Fixed total:                      28,427 MB (27.8 GB)
#
#   KV cache (131K ctx, q8_0):         5,427 MB (42.5 KB/tok)
#   4 checkpoints x 638 MB:            2,550 MB
#   Cache-RAM:                         4,096 MB
#   ─────────────────────────────────────────
#   Estimated total:                  40,500 MB (39.6 GB)
#   Cache save peak:                  +6,724 MB (transient at 131K)
#   Estimated peak:                   47,224 MB (46.1 GB)
#   Headroom:                          8,776 MB ( 8.6 GB)
#
# ── Benchmark Results (2026-04-07, llama-bench, Q6_K_L, gfx1151) ────────────
#   pp512:  231.5 tok/s    (vs Vulkan 129.2 — ROCm 79% faster)
#   pp2048: 168.1 tok/s    (vs Vulkan 112.0 — ROCm 50% faster)
#   pp8192: 140.6 tok/s    (Vulkan crashed at this size)
#   tg128:    7.67 tok/s   (vs Vulkan ~6.3-6.5)
#
# ── Stress Test Results (2026-04-07, Vulkan build) ───────────────────────────
#   Method: rustyclaw-driver via openclaw (real tool calls, 10 tasks)
#   Tasks 1-5 completed, no errors, no OOM
#   RAM at 64K tokens: 50-52 GB (system total incl. OS + gateways + signal-cli)
#   Prompt processing: 52-116 tok/s (degrades with context depth, iSWA)
#   Generation: 6.3-6.5 tok/s single slot (expect ~7.7 with ROCm)
#   Checkpoint rotation: working correctly (4 of 4)
#   Cache restore failure once (475 MB) — non-fatal, Gemma 4 #21468
#   Verdict: APPROVED
#
# ── Known Issues ─────────────────────────────────────────────────────────────
#   - Gemma 4 cache reuse broken upstream (llama.cpp #21468)
#   - Jinja parser stack overflow — use JINJA=0, peg-gemma4 works
#   - --flash-attn requires explicit value: --flash-attn on
#   - ROCm gfx1100 (7900 series) does NOT work on Strix Halo — HIP assertion fail
#
# ── Fallback Options ─────────────────────────────────────────────────────────
#   q4_0 KV cache: saves 2.7 GB (KV drops 5.4 → 2.7 GB). Test tool quality.
#   Q4_K_M weights: saves ~10 GB (model drops 28 → 18 GB). Last resort.
#
# ── Cost Matrix (for custom tuning) ──────────────────────────────────────────
#   KV per token (q8_0): 42.5 KB    KV per token (q4_0): 21.3 KB
#   Cache save peak:     52.6 KB/tok (transient during save)
#   Checkpoint:          637.5 MB each
#   Formula: TOTAL = 28.4 + (CTX * KV_KB / 1024^2) + (CP * 0.623) + CACHE_GB

CONTEXT=131072
PARALLEL=1
CACHE_RAM=4096
CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0
CHECKPOINT_INTERVAL=8192
CHECKPOINT_MAX=4

# Disable --jinja: Gemma 4 chat template triggers std::regex stack overflow
# in llama.cpp's Jinja parser. The native peg-gemma4 parser works without it.
JINJA=0
