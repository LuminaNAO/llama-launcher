# Per-model config for: gemma-4-31B (all quants) — 128GB profile
# Gemma 4 31B dense with iSWA (interleaved sliding window attention)
#
# Dense model — all 31B params active every token
# Verified performance on Strix Halo (Radeon 8060S, Vulkan):
#   - Prompt processing: 130-150 tok/s
#   - Generation: 7-8 tok/s single slot, 3-4 tok/s per slot parallel
#   - Peak memory: ~60 GB (model 28GB + KV 5.4GB + 16 checkpoints 10.2GB + cache)
#   - Budget: 90 GB max → ~30 GB headroom for OS/ComfyUI/etc
#
# For 64GB systems see google_gemma-4-31B-it.64gb.conf

CONTEXT=131072
PARALLEL=2
CACHE_RAM=20480
CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0
CHECKPOINT_INTERVAL=4096
CHECKPOINT_MAX=16

# Disable --jinja: Gemma 4 chat template triggers std::regex stack overflow
# in llama.cpp's Jinja parser. The native peg-gemma4 parser works without it.
JINJA=0
