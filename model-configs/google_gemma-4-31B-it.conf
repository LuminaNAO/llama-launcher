# Per-model config for: gemma-4-31B (all quants)
# Gemma 4 31B dense with iSWA (interleaved sliding window attention)
#
# Dense model — all 31B params active every token (~6.6 tok/s on Strix Halo)
# Context capped to 262k (model training limit).
#
# This is the 128GB profile. For 64GB see google_gemma-4-31B-it.64gb.conf

CONTEXT=131072
PARALLEL=2
CACHE_RAM=20480
CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0
CHECKPOINT_INTERVAL=4096
CHECKPOINT_MAX=16

# Disable --jinja: Gemma 4 chat template triggers std::regex stack overflow
# in llama.cpp's Jinja parser. The native peg-gemma4 parser works without it.
JINJA=0
