# Per-model launch config for: unsloth_gemma-4-31B-it-Q8_0.gguf
# Gemma 4 31B dense with iSWA (interleaved sliding window attention)
#
# Dense model — all 31B params active every token (~6.6 tok/s on Strix Halo)
# iSWA uses two KV caches (SWA + non-SWA), so KV memory per token is much
# larger than MoE models. 488k context OOMs; 32k is safe on 128 GB.
# Model weights: ~31 GB (Q8_0)

# Context capped to 262k (model training limit).
CONTEXT=262144
PARALLEL=2
CACHE_RAM=30720
CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0
CHECKPOINT_INTERVAL=4096
CHECKPOINT_MAX=64
