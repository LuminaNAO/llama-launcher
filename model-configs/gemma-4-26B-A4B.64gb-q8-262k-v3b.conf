# Tune: 64gb-q8-262k-v3b
# Per-model config for: gemma-4-26B-A4B-it (Q8_0, MoE 128 experts / 8 active)
# Target: 64 GB system, HARD CEILING 50 GB — must be verified by vram-stress-test.sh
# Candidate: moderate (parallel=2, checkpoints=30)
#
# v3b strategy: same as v3a but more checkpoints
#   - If v3a passes with headroom, v3b tests whether 30 checkpoints still fits

# ── Context & Scheduling ────────────────────────────────────────────────────
CONTEXT=262144
PARALLEL=2

# ── KV Cache ────────────────────────────────────────────────────────────────
CACHE_RAM=0
CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0
KV_UNIFIED=1

# ── Checkpoints ─────────────────────────────────────────────────────────────
CHECKPOINT_INTERVAL=4096
CHECKPOINT_MAX=30

# ── GPU Offload ─────────────────────────────────────────────────────────────
NGL=99
FLASH_ATTN=1

# ── Sampling ────────────────────────────────────────────────────────────────
# Google-recommended defaults — DO NOT lower temp, causes repeat loops
TEMP=1.0
TOP_P=0.95
TOP_K=64

# ── Reasoning / Thinking ────────────────────────────────────────────────────
# Force thinking on: with many tools, Gemma 4 skips the thinking phase in
# auto mode. Forcing it on ensures reasoning_content is always populated.
REASONING=on
REASONING_BUDGET=8192

# ── Anti-repeat ─────────────────────────────────────────────────────────────
# Not needed at temp=1.0. Uncomment only if repeat loops return.
# DRY_MULTIPLIER=0.8
# DRY_BASE=1.75
# DRY_ALLOWED_LENGTH=2
# DRY_PENALTY_LAST_N=-1
# REPEAT_PENALTY=1.05
# REPEAT_LAST_N=256
# PRESENCE_PENALTY=0.0
# FREQUENCY_PENALTY=0.0

# ── Server ──────────────────────────────────────────────────────────────────
HOST=0.0.0.0
PORT=40801
API_KEY=ollama-local
TIMEOUT=3600
THREADS=32

# ── I/O & Memory ────────────────────────────────────────────────────────────
NO_MMAP=1
DIO=1

# ── Template ────────────────────────────────────────────────────────────────
# JINJA=1

# ── Extra ───────────────────────────────────────────────────────────────────
# EXTRA_ARGS=""
