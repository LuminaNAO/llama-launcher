# Tune: 24gb-q8-131k-v2
# Per-model config for: Qwen3.5-27B-Claude-4.6-Opus-Reasoning-Distilled (Q4_K_M)
# Target: 24 GB discrete GPU (e.g. 7900 XTX on ROCm)
# Tested: 2026-04-08 on Strix Halo Vulkan (quality verified, VRAM portable)
#
# Architecture: Qwen3.5 hybrid SSM/attention (Gated Delta Net)
#   - 64 layers total, only 16 use KV cache (full_attention_interval=4)
#   - Extremely memory-efficient KV: ~34 MB/1K tokens at q8_0
#   - SSM recurrent state: ~150 MiB fixed (independent of context)
#
# VRAM breakdown at 131K context:
#   Model weights (Q4_K_M):  15,082 MiB
#   KV cache (q8_0, 16 layers): 4,352 MiB
#   SSM recurrent state (f32):    150 MiB
#   Checkpoints (4x ~150 MiB):    600 MiB
#   Compute buffers:               495 MiB
#   Total GPU:                  20,679 MiB (~20.2 GB)
#   Headroom on 24 GB:           ~3.8 GB
#
# v2 changes:
#   - CHECKPOINT_MAX 1 → 4: SSM hybrid architecture forces full reprocess when
#     the token prefix diverges (e.g. openclaw context compression between turns).
#     More checkpoints give better restore points, avoiding 80K+ token re-ingestion.
#
# Quality checks (all passed, stress-tested 5K–110K prompt tokens):
#   - Tool calling: correct function selection, valid JSON args, proper finish_reason
#   - Code generation: zero repeat sequences (5-line/80-char check)
#   - Context ladder: PASS at 5K, 15K, 30K, 50K, 70K, 90K (109,742 prompt tokens)
#   - Thinking: reasoning_content properly separated, natural budget deactivation
#   - Speed: ~12.5 tok/s gen @ 5K, ~10.0 tok/s gen @ 110K (Vulkan, Strix Halo)
#
# Thinking format: qwen (<think> tags) — set MODEL_THINKING_FORMAT=qwen in openclaw
# Vision: skip mmproj at launch (saves VRAM, not needed for coding agent)

# ── Context & Scheduling ────────────────────────────────────────────────────
CONTEXT=131072
PARALLEL=1

# ── KV Cache ────────────────────────────────────────────────────────────────
CACHE_RAM=0
CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0
KV_UNIFIED=1

# ── Checkpoints ─────────────────────────────────────────────────────────────
CHECKPOINT_INTERVAL=4096
CHECKPOINT_MAX=4

# ── GPU Offload ─────────────────────────────────────────────────────────────
NGL=99
FLASH_ATTN=1

# ── Sampling ────────────────────────────────────────────────────────────────
TEMP=0.3
TOP_P=0.95
TOP_K=20

# ── Server ──────────────────────────────────────────────────────────────────
HOST=0.0.0.0
PORT=40801
API_KEY=ollama-local
TIMEOUT=3600
THREADS=32

# ── I/O & Memory ────────────────────────────────────────────────────────────
NO_MMAP=1
DIO=1

# ── Template ────────────────────────────────────────────────────────────────
# JINJA=1

# ── Extra ───────────────────────────────────────────────────────────────────
# EXTRA_ARGS=""
