# Tune: 64gb-q8-262k-v3c
# Per-model config for: gemma-4-26B-A4B-it (Q8_0, MoE 128 experts / 8 active)
# Target: 64 GB system, HARD CEILING 50 GB — must be verified by vram-stress-test.sh
# Candidate: aggressive (parallel=4, checkpoints=8)
#
# v3c strategy: keep 4 slots but minimal checkpoints
#   - Tests whether parallel=4 is even possible within 50 GB
#   - If this fails, parallel=4 at 262K is simply not viable on 64 GB

# ── Context & Scheduling ────────────────────────────────────────────────────
CONTEXT=262144
PARALLEL=4

# ── KV Cache ────────────────────────────────────────────────────────────────
CACHE_RAM=0
CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0
KV_UNIFIED=1

# ── Checkpoints ─────────────────────────────────────────────────────────────
CHECKPOINT_INTERVAL=4096
CHECKPOINT_MAX=8

# ── GPU Offload ─────────────────────────────────────────────────────────────
NGL=99
FLASH_ATTN=1

# ── Sampling ────────────────────────────────────────────────────────────────
TEMP=1.0
TOP_P=0.95
TOP_K=64

# ── Reasoning / Thinking ────────────────────────────────────────────────────
REASONING=on
REASONING_BUDGET=8192

# ── Server ──────────────────────────────────────────────────────────────────
HOST=0.0.0.0
PORT=40801
API_KEY=ollama-local
TIMEOUT=3600
THREADS=32

# ── I/O & Memory ────────────────────────────────────────────────────────────
NO_MMAP=1
DIO=1
