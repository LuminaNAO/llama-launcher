# Tune: 128gb-q8-131k-v1
# Per-model config for: gemma-4-31B-it (Q8_0, dense 31B)
# Target: 128 GB system, ~100 GB ceiling
# Based on: 64gb-q8-131k-v1 with extra 50 GB for cache + checkpoints
#
# Architecture: Gemma 4 31B dense (NOT MoE)
#   - All 31B parameters active per token
#   - Sliding Window Attention (same iSWA as MoE variant)
#   - Context: 131072 (agents auto-compact at ~131K)
#
# Memory budget estimate (131K, 2 slots):
#   Model weights (Q8_0):        ~31.0 GB
#   KV cache (2 slots × 131K):    ~4.0 GB
#   CACHE_RAM (prompt cache):     28.0 GB
#   Checkpoints (76 × 265 MiB): ~19.7 GB
#   Compute buffers:              ~2.5 GB
#   Estimated total:             ~85.2 GB
#   Headroom to 100 GB limit:   ~14.8 GB
#
# Benefit over 64 GB tune:
#   - 28 GB prompt cache (vs 4 GB): system prompts + tool defs stay cached.
#   - 76 checkpoints (vs 12): near-zero reprocessing on slot switches.
#   - PARALLEL=2: can serve 2 concurrent sessions.
#
# Dense 31B is smarter than MoE 26B (31B active vs 4B active) but slower
# per token (~15-20 tok/s vs ~43 tok/s on same hardware).

# ── Context & Scheduling ────────────────────────────────────────────────────
CONTEXT=131072
PARALLEL=2

# ── KV Cache ────────────────────────────────────────────────────────────────
CACHE_RAM=102400
CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0
KV_UNIFIED=1

# ── Checkpoints ─────────────────────────────────────────────────────────────
CHECKPOINT_INTERVAL=8192
CHECKPOINT_MAX=76

# ── GPU Offload ─────────────────────────────────────────────────────────────
NGL=99
FLASH_ATTN=1

# ── Sampling ────────────────────────────────────────────────────────────────
TEMP=1.0
TOP_P=0.95
TOP_K=64

# ── Reasoning / Thinking ────────────────────────────────────────────────────
REASONING=on
REASONING_BUDGET=8192

# ── Anti-repeat ─────────────────────────────────────────────────────────────
# DRY OFF: breaks tool call emission. Not needed at temp=1.0.
# DRY_MULTIPLIER=0.8
# DRY_BASE=1.75
# DRY_ALLOWED_LENGTH=2
# DRY_PENALTY_LAST_N=512

# ── Server ──────────────────────────────────────────────────────────────────
HOST=0.0.0.0
PORT=40801
API_KEY=ollama-local
TIMEOUT=3600
THREADS=32

# ── I/O & Memory ────────────────────────────────────────────────────────────
NO_MMAP=1
DIO=1

# ── Template ────────────────────────────────────────────────────────────────
JINJA=0

# ── Extra ───────────────────────────────────────────────────────────────────
# EXTRA_ARGS=""
