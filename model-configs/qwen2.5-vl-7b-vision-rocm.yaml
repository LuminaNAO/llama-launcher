kind: llama-launcher-tune
version: 1
name: "qwen2.5-vl-7b-vision-rocm"
model: "Qwen2.5-VL-7B-Instruct"
metadata:
  shareable: true
  notes: |-
    Tune: qwen2.5-vl-7b-vision-rocm
    Vision-language model for image understanding on buildhost.
    Hardware: buildhost (ROCm GPU, 125GB RAM)
    Model: Qwen2.5-VL-7B-Instruct Q4_K_M + mmproj f16
    Model weights: ~4.5 GB | mmproj: ~1.3 GB
    Port: 40803 (text model on 40802)
    Requires --mmproj flag for vision support
    JINJA=1 for Qwen chat template
    EXTRA_ARGS="--mmproj /mnt/storage/models/Qwen2.5-VL-7B-Instruct/mmproj-Qwen2.5-VL-7B-Instruct-f16.gguf"
settings:
  API_KEY: "ollama-local"
  CACHE_RAM: "4096"
  CACHE_TYPE_K: "q4_0"
  CACHE_TYPE_V: "q4_0"
  CHECKPOINT_MAX: "8"
  CONTEXT: "32768"
  DIO: "1"
  FLASH_ATTN: "1"
  HOST: "0.0.0.0"
  JINJA: "1"
  KV_UNIFIED: "1"
  NGL: "99"
  NO_MMAP: "1"
  PARALLEL: "1"
  PORT: "40803"
  TEMP: "0.1"
  THREADS: "16"
  TIMEOUT: "3600"
  TOP_K: "20"
  TOP_P: "0.9"
  MM_PROJ: "/mnt/storage/models/Qwen2.5-VL-7B-Instruct/mmproj-Qwen2.5-VL-7B-Instruct-f16.gguf"
