# Tune: 128gb-iq4xs-100k-v1
# Per-model config for: MiniMax-M2.7-UD-IQ4_XS (Unsloth Dynamic 2.0 4-bit)
# Target: Strix Halo / AMD Ryzen AI Max+ 395 — 128 GB unified
#
# Architecture: MiniMax M2 (minimax_m2) — Dense MoE
#   - 62 layers, full attention (no SWA, no hybrid, no recurrent)
#   - 48 attention heads, 8 KV heads (GQA 6:1), head_dim=128
#   - 256 experts, 8 active per token (229B total, ~10B active)
#   - RoPE theta: 5,000,000 (rotary_dim=64)
#   - Max position embeddings: 204,800 (~200K native)
#
# Model file: 4 splits, ~101 GB on disk (UD-IQ4_XS)
#
# Expected allocations (102_400 ctx, 1 slot, unified KV, q4_0 K/V, FA on):
#   Model weights (ROCm0):                100,350 MiB
#   KV cache (ROCm0, 100k q4_0):            ~6,600 MiB  (~half of q8_0)
#   FA scratch @ -ub 256:                  ~1,800 MiB
#   Compute buffers (ROCm0 + Host):           ~540 MiB
#   ──────────────────────────────────────────────────
#   Total on-device:                      ~109.3 GB on 118 GB budget → ~8.7 GB headroom
#
# RATIONALE: Rotor quants (PR #21038, merged upstream 2026-04-01) Hadamard-rotate
# activations before KV quantization. This makes q4_0 KV nearly indistinguishable
# from q8_0 KV in fidelity — so we trade "quality cost of q4" for "+37k context".
# Rotation auto-enables because head_dim=128 is divisible by 64.
#
# Sampling: MiniMax official recommendation — temp=1.0, top_p=0.95, top_k=40,
# plus min_p=0.01 per Unsloth guide.
#
# STRESS RESULTS (2026-04-23, build 8898 f98d307aa, ROCm 7.2.2, rotation active):
#   Tool-call stress (9 levels, 0→95K padding tokens):
#     ALL PASS 9/9 — every level returned PARTIAL 1/3 tools [get_weather] which
#     is MiniMax's canonical one-at-a-time tool-call pattern, not a failure.
#     Zero hangs, zero parse errors, zero raw template leakage.
#     Includes the 55K level which hung on the 64k-q8 tune overnight 2026-04-22.
#   Code-edit quality (14 tests): 12/14 pass (85.7%)
#     5/5 baseline, 2/3 @ 20K (T7 narrated instead of calling edit_file),
#     3/3 @ 50K, 2/3 @ 80K (T12 used read_file instead of edit_file).
#     Both failures are behavioral tool-choice, not infrastructure.
#   Throughput (llama.cpp /v1 bench, actual-prompt-tokens in parens):
#     short  (44)     pp=68.5  tg=24.6 tok/s
#     med    (3204)   pp=139.6 tg=22.2
#     large  (9557)   pp=116.5 tg=17.9
#     xl    (38155)   pp=69.0  tg=9.4
#   vs pre-rotor 64k-q8 partial baseline (2026-04-22): pp/tg within ~1% at short/med/large.
#   Conclusion: q4_0 KV + rotor quants delivers 100k ctx at zero throughput cost vs q8_0 @ 64k.
#
# ── Context & Scheduling ────────────────────────────────────────────────────
CONTEXT=102400
PARALLEL=1

# ── KV Cache ────────────────────────────────────────────────────────────────
# q4_0 KV with rotor-quants rotation applied automatically (head_dim=128 % 64 == 0).
CACHE_RAM=102400
CACHE_TYPE_K=q4_0
CACHE_TYPE_V=q4_0
KV_UNIFIED=1

# ── GPU Offload ─────────────────────────────────────────────────────────────
NGL=99
FLASH_ATTN=1

# ── Sampling (MiniMax official) ─────────────────────────────────────────────
TEMP=1.0
TOP_P=0.95
TOP_K=40

# ── Reasoning / Thinking ────────────────────────────────────────────────────
REASONING=on
REASONING_BUDGET=-1

# ── Server ──────────────────────────────────────────────────────────────────
HOST=0.0.0.0
PORT=40801
API_KEY=ollama-local
TIMEOUT=3600
THREADS=32

# ── I/O & Memory ────────────────────────────────────────────────────────────
NO_MMAP=1
DIO=1

# ── Template ────────────────────────────────────────────────────────────────
JINJA=1

# ── Extra ───────────────────────────────────────────────────────────────────
# min_p=0.01 per Unsloth guide.
# -ub 256 / -b 1024: kept from 64k tune. 100k q4 KV leaves ~8.7 GB headroom; could
# in principle try -ub 512 (+1.8 GB), but prefer stability for first 100k run.
# Revisit -ub 512 as a follow-up tune once this one is proven stable.
EXTRA_ARGS="--min-p 0.01 -ub 256 -b 1024"
