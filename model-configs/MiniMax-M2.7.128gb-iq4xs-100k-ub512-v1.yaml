kind: llama-launcher-tune
version: 1
name: "128gb-iq4xs-100k-ub512-v1"
model: "MiniMax-M2"
metadata:
  shareable: true
  notes: |-
    Tune: 128gb-iq4xs-100k-ub512-v1
    Per-model config for: MiniMax-M2.7-UD-IQ4_XS (Unsloth Dynamic 2.0 4-bit)
    Target: Strix Halo / AMD Ryzen AI Max+ 395 — 128 GB unified
    Architecture: MiniMax M2 (minimax_m2) — Dense MoE
    - 62 layers, full attention (no SWA, no hybrid, no recurrent)
    - 48 attention heads, 8 KV heads (GQA 6:1), head_dim=128
    - 256 experts, 8 active per token (229B total, ~10B active)
    - RoPE theta: 5,000,000 (rotary_dim=64)
    DIFFERENCE FROM 100k-v1: `-ub 512 -b 2048` (vs 256 / 1024). FA tile scratch
    doubles from ~1.8 GB to ~3.6 GB; PP kernels get 2× work per launch → higher
    GPU occupancy → expected PP tok/s roughly doubles on long prompts, and GPU
    power should pull closer to the 140W envelope it's rated for.
    Expected allocations (102_400 ctx, 1 slot, unified KV, q4_0 K/V, FA on):
    Model weights (ROCm0):                100,350 MiB
    KV cache (ROCm0, 100k q4_0):            ~6,600 MiB
    FA scratch @ -ub 512:                  ~3,600 MiB
    Compute buffers (ROCm0 + Host):           ~540 MiB
    Total on-device:                      ~111.1 GB on 118 GB budget → ~6.9 GB headroom
    (down from ub256's 8.7 GB — still enough for well-behaved prompts)
    HISTORY: -ub 512 with q8_0 KV at 64k ctx OOM'd on an 18K prompt (2026-04-22).
    With q4_0 KV freeing ~6 GB, -ub 512 should now fit at 100k ctx.
    Sampling: MiniMax official recommendation — temp=1.0, top_p=0.95, top_k=40,
    plus min_p=0.01 per Unsloth guide.
    CACHE_RAM=0 disables the in-RAM prompt cache (host-memory heap, was the
    source of swap thrashing when contexts grew large + multi-session).
    Cross-session warm cache is now provided by SLOT_SAVE_PATH (disk-backed,
    automatic via deep-proxy session-hash detection).
    Proxy hashes (system + messages[0].content) per request, calls
    /slots/0?action={save,restore} on session switch and on graceful shutdown.
    Each saved file ≈ 7 GB at 100k ctx q4_0 KV. ~250 GB headroom on /mnt/storage.
    Launcher auto-namespaces per-quant: actual slot dir becomes
    $SLOT_SAVE_PATH/$(basename $model_path .gguf)/
    so each .gguf has an isolated cache pool (KV bytes are quant-specific).
settings:
  API_KEY: "ollama-local"
  CACHE_RAM: "0"
  CACHE_TYPE_K: "q4_0"
  CACHE_TYPE_V: "q4_0"
  CONTEXT: "102400"
  DIO: "1"
  EXTRA_ARGS: "--min-p 0.01 -ub 512 -b 2048"
  FLASH_ATTN: "1"
  HOST: "0.0.0.0"
  JINJA: "1"
  KV_UNIFIED: "1"
  NGL: "99"
  NO_MMAP: "1"
  PARALLEL: "1"
  PORT: "40801"
  REASONING: "on"
  REASONING_BUDGET: "-1"
  SLOT_SAVE_PATH: "/mnt/storage/llama-slots"
  TEMP: "1.0"
  THREADS: "32"
  TIMEOUT: "3600"
  TOP_K: "40"
  TOP_P: "0.95"
