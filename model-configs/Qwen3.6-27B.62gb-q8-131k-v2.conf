# Tune: 62gb-q8-131k-v2
# Per-model config for: Qwen3.6-27B-Q8_0 (full-precision 8-bit, ~29 GiB)
# Target: this machine — 62 GB unified memory
# Intended use: openclaw coding agent
#
# DIFFERENCE FROM v1: drops CACHE_RAM entirely (was 10 GiB ceiling) and
# replaces in-RAM prompt cache with disk-backed slot persistence via
# llama-deep-proxy + SLOT_SAVE_PATH. The proxy auto-saves/restores the full
# KV state on session switch and graceful shutdown.
#
# Why this is better on unified memory:
#   In-RAM cache and model weights compete for the same physical pages.
#   Disk-backed slots move the warm-context cost off RAM entirely — the NVMe
#   holds the KV state, RAM holds only the active slot and model weights.
#   Cold restore latency = NVMe read speed (~4 GB slot file), typically < 5s.
#   Cold prefill at 131k context is the alternative; restore wins unless the
#   session truly diverged.
#
# Slot file size estimate (131k ctx, q8_0 KV, 16 attn layers only):
#   16 layers × 4 KV heads × 256 head_dim × 131072 tokens × 2 (K+V) × 1 B
#   ≈ 4.0 GB per saved slot
#   / has ~61 GB free → keep an eye on accumulation; prune old slots as needed.
#
# Launcher behavior: SLOT_SAVE_PATH auto-enables --proxy at launch.
# Proxy hashes (system + messages[0].content) per request and calls
# /slots/0?action={save,restore} on session switch. Per-quant namespacing:
#   /usr/local/share/llama.cpp/llama-slots/Qwen3.6-27B-Q8_0/

# ── Context & Scheduling ────────────────────────────────────────────────────
CONTEXT=131072
PARALLEL=1

# ── KV Cache ────────────────────────────────────────────────────────────────
# CACHE_RAM=0: in-RAM prompt cache disabled; cross-session warmth from SLOT_SAVE_PATH
CACHE_RAM=0
CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0
KV_UNIFIED=1

# ── Slot persistence (auto-managed by llama-deep-proxy) ─────────────────────
SLOT_SAVE_PATH=/usr/local/share/llama.cpp/llama-slots

# ── GPU Offload ─────────────────────────────────────────────────────────────
NGL=99
FLASH_ATTN=1

# ── Sampling ────────────────────────────────────────────────────────────────
TEMP=0.6
TOP_P=0.95
TOP_K=20

# ── Reasoning / Thinking ────────────────────────────────────────────────────
REASONING=on
REASONING_BUDGET=-1

# ── Server ──────────────────────────────────────────────────────────────────
HOST=0.0.0.0
PORT=40801
API_KEY=ollama-local
TIMEOUT=3600
THREADS=32

# ── I/O & Memory ────────────────────────────────────────────────────────────
NO_MMAP=1
DIO=1

# ── Template ────────────────────────────────────────────────────────────────
JINJA=1

# ── Extra ───────────────────────────────────────────────────────────────────
EXTRA_ARGS="--min-p 0.0 -ub 512 -b 2048"
