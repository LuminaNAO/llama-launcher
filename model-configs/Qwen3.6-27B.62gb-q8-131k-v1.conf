# Tune: 62gb-q8-131k-v1
# Per-model config for: Qwen3.6-27B-Q8_0 (full-precision 8-bit, ~29 GiB)
# Target: this machine — 62 GB unified memory (CPU+GPU share same physical RAM)
# Intended use: openclaw coding agent
#
# Architecture: qwen35 (hybrid linear-attn) — 27B dense, 64 layers
#   - Layout: 16 × (3× Gated DeltaNet + 1× Gated Attention)
#       → 16 of 64 layers carry full-attention KV; the other 48 carry a
#         small ctx-independent SSM/DeltaNet recurrent state
#   - Full attention: 24 Q heads, 4 KV heads (GQA 6:1), head_dim=256
#   - DeltaNet (SSM): state_size=128, inner_size=6144, group_count=16
#   - RoPE theta: 10,000,000   Native ctx: 262,144
#
# Unified memory notes:
#   GPU and CPU share the same physical RAM — no VRAM budget to fight over.
#   - NGL=99 offloads all layers; compute lands in GPU but pages are the same
#     physical addresses the CPU sees. No copy penalty.
#   - KV at q8_0 (not q4_0): we have the headroom, q4_0 was a discrete-GPU
#     VRAM-saving hack. q8_0 gives noticeably better quality on long contexts.
#   - Batches at -ub 512 -b 2048: not VRAM-constrained, use full batch width.
#   - CACHE_RAM=10240: 10 GiB ceiling — well above actual KV use at 131k ctx
#     (q8_0 KV for 131k ≈ 4 GB), comfortable headroom without pinching the OS.
#
# Expected allocations (131072 ctx, 1 slot, q8_0 K/V, FA on, -ub 512):
#   Model weights:                ~29,700 MiB   (no-mmap, all loaded)
#   KV cache (131k q8_0):          ~4,100 MiB   (16 attn layers only)
#   SSM/DeltaNet recurrent state:    ~150 MiB
#   FA scratch @ -ub 512:          ~3,600 MiB
#   Compute buffers:                 ~500 MiB
#   ──────────────────────────────────────────
#   Working set:                  ~38.1 GB → leaves ~24 GB for OS + other procs
#
# Sampling: same as existing Qwen3.6 tunes (Qwen-team recommendation for code).

# ── Context & Scheduling ────────────────────────────────────────────────────
CONTEXT=131072
PARALLEL=1

# ── KV Cache ────────────────────────────────────────────────────────────────
CACHE_RAM=10240
CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0
KV_UNIFIED=1

# ── GPU Offload ─────────────────────────────────────────────────────────────
NGL=99
FLASH_ATTN=1

# ── Sampling ────────────────────────────────────────────────────────────────
TEMP=0.6
TOP_P=0.95
TOP_K=20

# ── Reasoning / Thinking ────────────────────────────────────────────────────
REASONING=on
REASONING_BUDGET=-1

# ── Server ──────────────────────────────────────────────────────────────────
HOST=0.0.0.0
PORT=40801
API_KEY=ollama-local
TIMEOUT=3600
THREADS=32

# ── I/O & Memory ────────────────────────────────────────────────────────────
NO_MMAP=1
DIO=1

# ── Template ────────────────────────────────────────────────────────────────
JINJA=1

# ── Extra ───────────────────────────────────────────────────────────────────
EXTRA_ARGS="--min-p 0.0 -ub 512 -b 2048"
