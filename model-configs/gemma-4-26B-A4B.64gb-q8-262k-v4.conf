# Tune: 64gb-q8-262k-v4
# Per-model config for: gemma-4-26B-A4B-it (Q8_0, MoE 128 experts / 8 active)
# Target: 64 GB system, HARD CEILING 50 GB
# Verified: 2026-04-09 soak test (1 hour, 12 waves) — peak GTT 30,772 MB
#
# Architecture: Gemma 4 MoE with Sliding Window Attention
#   - 30 layers: 25 SWA (window=1024) + 5 full attention (layers 5,11,17,23,29)
#   - Full attn layers: 2 KV heads, head_dim=512
#   - SWA layers: 8 KV heads, head_dim=256, window=1024 (fixed cost)
#   - 128 experts, 8 active per token (26B total, ~4B active)
#   - Context: 262144 native
#   - Thinking model: uses <|channel>thought tags (peg-gemma4 template)
#
# v4 changes vs v3b (based on production log analysis):
#   - CHECKPOINT_MAX 30 → 20: each checkpoint is 159.5 MiB (measured, not
#     estimated). 30 × 159.5 = 4.7 GB was overkill — SWA invalidates ALL
#     checkpoints when context diverges between slots. Checkpoints only help
#     same-slot sequential requests with shared prefixes (LCP ~0.99). 20 is
#     enough to cover typical coding agent conversation depth while saving
#     ~1.6 GB of pre-allocated memory.
#   - CHECKPOINT_INTERVAL 4096 → 8192: with SWA window=1024, fine-grained
#     checkpoints don't survive slot switches anyway. Doubling the interval
#     halves checkpoint creation overhead during prompt processing while
#     still giving useful restore points for same-slot reuse.
#   - Header updated with measured VRAM data (no more napkin math)
#
# Measured VRAM (soak test, 2026-04-09, Vulkan Strix Halo):
#   Idle GTT (model loaded):    30,767 MiB (30.0 GB)
#   Peak GTT (1hr concurrent):  30,772 MiB (30.0 GB)
#   GTT delta under load:             5 MiB (flat — fully pre-allocated)
#   Headroom to 50 GB limit:   ~20,428 MiB (20.0 GB)
#
# Checkpoint behavior (from production logs):
#   - Each checkpoint: 159.5 MiB (pos_min/pos_max span + SWA state)
#   - Same-slot sequential: checkpoints reused via LCP match (~0.99 hit rate)
#   - Cross-slot divergence: ALL checkpoints erased, full reprompt from zero
#   - KV_UNIFIED=1 is CRITICAL: without it, slots can't share cached prefixes
#     and every slot switch triggers a full 100K+ token re-process
#
# Sampling: Google recommends temp=1.0, top_k=64, top_p=0.95 for Gemma 4.
# CRITICAL: Lower temperatures (0.3-0.5) cause severe repetition loops.
# The fix is temp=1.0 as designed, NOT anti-repeat penalties.
#
# Quality checks (all passed at v1, same sampling):
#   - Tool calling: correct function selection, valid JSON args
#   - Code generation: 12-endpoint FastAPI, zero repeats
#   - Structured output: Korean quiz, Hangeul recognition — zero repeats
#   - Thinking: reasoning_content properly separated via peg-gemma4 template
#   - Speed: ~43-45 tok/s generation per slot (Vulkan, Strix Halo)
#
# Known issues:
#   - Vulkan: may hit <unused> token loops (llama.cpp #21516) — open bug
#   - ROCm: <unused24> infinite loop on Strix Halo (llama.cpp #21416)
#   - Tool calls: use parallel_tool_calls=false to prevent loop (#21375)
#
# Vision: mmproj available but disabled for coding agent use

# ── Context & Scheduling ────────────────────────────────────────────────────
CONTEXT=262144
PARALLEL=2

# ── KV Cache ────────────────────────────────────────────────────────────────
# KV_UNIFIED is critical for SWA models — lets slots share cached prefixes.
# Without it, every slot switch forces a full reprompt from zero.
# CACHE_RAM enables shared prompt caching (system prompt reuse across requests).
CACHE_RAM=2048
CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0
KV_UNIFIED=1

# ── Checkpoints ─────────────────────────────────────────────────────────────
# Each checkpoint = 159.5 MiB (measured). Only useful for same-slot sequential
# requests — SWA invalidates all checkpoints on cross-slot context divergence.
# 20 checkpoints × 159.5 MiB = ~3.1 GB pre-allocated.
CHECKPOINT_INTERVAL=8192
CHECKPOINT_MAX=20

# ── GPU Offload ─────────────────────────────────────────────────────────────
NGL=99
FLASH_ATTN=1

# ── Sampling ────────────────────────────────────────────────────────────────
# Google-recommended defaults — DO NOT lower temp, causes repeat loops
TEMP=1.0
TOP_P=0.95
TOP_K=64

# ── Reasoning / Thinking ────────────────────────────────────────────────────
# Force thinking on: with many tools, Gemma 4 skips the thinking phase in
# auto mode. Forcing it on ensures reasoning_content is always populated.
REASONING=on
REASONING_BUDGET=8192

# ── Anti-repeat ─────────────────────────────────────────────────────────────
# Not needed at temp=1.0. Uncomment only if repeat loops return.
# DRY_MULTIPLIER=0.8
# DRY_BASE=1.75
# DRY_ALLOWED_LENGTH=2
# DRY_PENALTY_LAST_N=-1
# REPEAT_PENALTY=1.05
# REPEAT_LAST_N=256
# PRESENCE_PENALTY=0.0
# FREQUENCY_PENALTY=0.0

# ── Server ──────────────────────────────────────────────────────────────────
HOST=0.0.0.0
PORT=40801
API_KEY=ollama-local
TIMEOUT=3600
THREADS=32

# ── I/O & Memory ────────────────────────────────────────────────────────────
NO_MMAP=1
DIO=1

# ── Template ────────────────────────────────────────────────────────────────
# JINJA=1

# ── Extra ───────────────────────────────────────────────────────────────────
# EXTRA_ARGS=""
