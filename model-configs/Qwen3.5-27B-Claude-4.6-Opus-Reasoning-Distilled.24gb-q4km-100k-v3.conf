# Tune: 24gb-q4km-100k-v3
# Per-model config for: Qwen3.5-27B-Claude-4.6-Opus-Reasoning-Distilled (Q4_K_M)
# Claude Opus 4.6 reasoning distillation by Jackrong. SFT + LoRA on ~3700
# samples of Claude reasoning trajectories. Native developer role, thinking
# preserved, good tool calling at lower context.
# Target: 24 GB discrete GPU (e.g. RX 7900 XTX on ROCm)
#
# Architecture: Qwen3.5 hybrid SSM/attention (Gated Delta Net)
#   - 64 layers total, only 16 use KV cache (full_attention_interval=4)
#   - Extremely memory-efficient KV: ~34 MB/1K tokens at q8_0
#   - SSM recurrent state: ~150 MiB fixed (independent of context)
#   - Context: 262144 native (capped to 100K for 24GB GPU)
#
# VRAM breakdown at 100K context:
#   Model weights (Q4_K_M):  15,082 MiB
#   KV cache (q8_0, 16 layers): 3,328 MiB
#   SSM recurrent state (f32):    150 MiB
#   Checkpoints (4x ~115 MiB):    460 MiB
#   Compute buffers:               495 MiB
#   Total GPU:                  19,515 MiB (~19.1 GB)
#   Headroom on 24 GB:           ~4.9 GB
#
# v3 changes from v2 (based on HuggingFace community findings):
#   - TEMP 0.3 → 0.7: GGUF page recommends 0.7-0.8 for structured thinking
#   - TOP_K 20 → 40: GGUF page recommends 40-50
#   - Added REPEAT_PENALTY=1.05: recommended on GGUF page, addresses
#     repetition loops observed at 70K+ context
#   - JINJA=1: model author fixed Jinja template for developer role support
#   - Added DRY sampling: additional repetition prevention for high context
#
# Thinking format: qwen (<think> tags) — set MODEL_THINKING_FORMAT=qwen
# Tool calling: sequential (1 tool per response, feed results back)
#   - This is normal Qwen behavior, not a bug
# Vision: skip mmproj at launch (saves VRAM, not needed for coding agent)
#
# Stress test results (b8791, Q4_K_M, JINJA=1):
#   0 failures, baseline through 120K (65K prompt tokens)
#   Tool calling: 1/3 tools per response (sequential, normal Qwen behavior)
#   All levels stable with DRY + repeat_penalty enabled
#
# Known issues (community):
#   - Repetition loops at very high context (70K+) — mitigated by DRY + repeat_penalty
#   - Tool/skill execution can fail in some agent setups (#76)
#   - Author recommends Qwopus-v3 for better tool behavior
#   - Thinking mode cannot be disabled via enable_thinking=false (#66)

# ── Context & Scheduling ────────────────────────────────────────────────────
CONTEXT=102400
PARALLEL=1

# ── KV Cache ────────────────────────────────────────────────────────────────
CACHE_RAM=0
CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0
KV_UNIFIED=1

# ── Checkpoints ─────────────────────────────────────────────────────────────
CHECKPOINT_INTERVAL=8192
CHECKPOINT_MAX=4

# ── GPU Offload ─────────────────────────────────────────────────────────────
NGL=99
FLASH_ATTN=1

# ── Sampling ────────────────────────────────────────────────────────────────
# Per GGUF model card: temp=0.7-0.8, top_k=40-50, repeat_penalty=1.05
TEMP=0.7
TOP_P=0.95
TOP_K=40

# ── Anti-repeat ─────────────────────────────────────────────────────────────
# Repetition loops reported at 70K+ context. Enable both repeat penalty
# (model card recommendation) and DRY (catches structural repeats).
REPEAT_PENALTY=1.05
REPEAT_LAST_N=256
DRY_MULTIPLIER=0.8
DRY_BASE=1.75
DRY_ALLOWED_LENGTH=2
DRY_PENALTY_LAST_N=512

# ── Reasoning / Thinking ────────────────────────────────────────────────────
# Qwen3.5 uses <think> tags. Thinking is always on for this distillation.
# Budget caps reasoning to prevent infinite thinking loops.
REASONING=on
REASONING_BUDGET=8192

# ── Server ──────────────────────────────────────────────────────────────────
HOST=0.0.0.0
PORT=40801
API_KEY=ollama-local
TIMEOUT=3600
THREADS=32

# ── I/O & Memory ────────────────────────────────────────────────────────────
NO_MMAP=1
DIO=1

# ── Template ────────────────────────────────────────────────────────────────
# JINJA=1: author fixed template for developer role support. Required for
# proper tool calling and coding agent integration.
JINJA=1

# ── Extra ───────────────────────────────────────────────────────────────────
# EXTRA_ARGS=""
