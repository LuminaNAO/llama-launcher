# Tune: 128gb-iq4xs-64k-v1
# Per-model config for: MiniMax-M2.7-UD-IQ4_XS (Unsloth Dynamic 2.0 4-bit)
# Target: Strix Halo / AMD Ryzen AI Max+ 395 — 128 GB unified
#
# Architecture: MiniMax M2 (minimax_m2) — Dense MoE
#   - 62 layers, full attention (no SWA, no hybrid, no recurrent)
#   - 48 attention heads, 8 KV heads (GQA 6:1), head_dim=128
#   - 256 experts, 8 active per token (229B total, ~10B active)
#   - RoPE theta: 5,000,000 (rotary_dim=64)
#   - Max position embeddings: 204,800 (~200K native)
#   - Vocab: 200,064
#
# Model file: 4 splits, ~101 GB on disk (UD-IQ4_XS)
#
# Observed allocations (65,536 ctx, 1 slot, unified KV, q8_0 K/V, FA on):
#   Model weights (ROCm0):                100,350 MiB  (~101 GB)
#   Model weights (ROCm_Host):                623 MiB
#   KV cache (ROCm0, 64k q8_0):             8,432 MiB  (~8.2 GB)
#   Compute buffers (ROCm0 + Host):           537 MiB
#   ──────────────────────────────────────────────────
#   Total on-device:                     ~109 GB
#   Idle system RAM used (total):         ~120 GiB of 125 GiB
#   Idle headroom:                        ~5 GiB
#
# HISTORY: 131k OOM'd (16.5 GB KV alloc failed); 96k OOM'd (12.6 GB alloc failed).
# 64k is the largest context that loads cleanly on this box.
#
# NOTE: Checkpoints (--ctx-checkpoints) only apply to SWA/recurrent/hybrid
# models. MiniMax M2.7 is full attention — KV cache IS the checkpoint.
# Flags are accepted but ignored by the server.
#
# Sampling: MiniMax official recommendation — temp=1.0, top_p=0.95, top_k=40,
# plus min_p=0.01 per Unsloth guide.
#
# Next tunes to try if more context is needed:
#   - q4_0 KV: halves KV to ~4 GB at 64k — could free room for 96k or 128k
#   - UD-Q3_K_XL: frees ~20 GB of model weight, room for longer context

# ── Context & Scheduling ────────────────────────────────────────────────────
CONTEXT=65536
PARALLEL=1

# ── KV Cache ────────────────────────────────────────────────────────────────
# Unified pool: single 131k slot, no per-slot duplication.
CACHE_RAM=4096
CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0
KV_UNIFIED=1

# ── Checkpoints (N/A for full-attention models) ─────────────────────────────
# CHECKPOINT_INTERVAL=4096
# CHECKPOINT_MAX=8

# ── GPU Offload ─────────────────────────────────────────────────────────────
NGL=99
FLASH_ATTN=1

# ── Sampling (MiniMax official) ─────────────────────────────────────────────
TEMP=1.0
TOP_P=0.95
TOP_K=40

# ── Reasoning / Thinking ────────────────────────────────────────────────────
# MiniMax M2.7 natively emits <think> tags. Force thinking on; clients can
# still send per-request budgets that override this default.
REASONING=on
REASONING_BUDGET=-1

# ── Anti-repeat ─────────────────────────────────────────────────────────────
# Clean slate — enable only if loops observed.
# DRY_MULTIPLIER=0.0
# REPEAT_PENALTY=1.0

# ── Server ──────────────────────────────────────────────────────────────────
HOST=0.0.0.0
PORT=40801
API_KEY=ollama-local
TIMEOUT=3600
THREADS=32

# ── I/O & Memory ────────────────────────────────────────────────────────────
# NO_MMAP + DIO + mlock = weights pinned in RAM, no swap risk.
NO_MMAP=1
DIO=1

# ── Template ────────────────────────────────────────────────────────────────
# MiniMax has its own chat template — honor it via jinja.
JINJA=1

# ── Extra ───────────────────────────────────────────────────────────────────
# min_p=0.01 per Unsloth guide (cuts low-probability tail at MiniMax's temp=1.0).
# -ub 256 / -b 1024: halve the FA tile scratch alloc; prior 512/2048 OOM'd during
# an 18k-token prompt. Costs some prompt-processing throughput, preserves 64k ctx.
EXTRA_ARGS="--min-p 0.01 -ub 256 -b 1024"
