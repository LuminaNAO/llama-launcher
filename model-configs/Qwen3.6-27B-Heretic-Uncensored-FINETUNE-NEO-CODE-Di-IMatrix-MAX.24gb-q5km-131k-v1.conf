# Tune: 24gb-q5km-131k-v1
# Per-model config for: Qwen3.6-27B-NEO-CODE-HERE-2T-OT-Q5_K_M (DavidAU, Q5_K_M)
# Target: 24 GB discrete GPU (e.g. RX 7900 XTX on ROCm)
# Intended use: openclaw coding agent
#
# Architecture: qwen35 (hybrid linear-attn) — 27B dense, 64 layers
#   - Layout: 16 × (3× Gated DeltaNet + 1× Gated Attention)
#       → 16 of 64 layers carry full-attention KV; the other 48 carry a
#         ctx-independent SSM/DeltaNet recurrent state (~150 MiB fixed)
#   - Full attention: 24 Q heads, 4 KV heads (GQA 6:1), head_dim=256
#   - DeltaNet (SSM): state_size=128, inner_size=6144, group_count=16
#   - RoPE theta: 10,000,000   Native ctx: 262,144
#   - imatrix: HERE-2T-OT dataset (DavidAU Heretic Uncensored NEO-CODE)
#
# Rotor quants: auto-enabled (head_dim=256, 256 % 64 == 0).
#   Rescues q4_0 KV to near-q8_0 fidelity (PR #21038, b8898+).
#   Enables q4_0 KV at half the VRAM of q8_0 without visible quality loss.
#
# KV math (only 16/64 layers carry KV):
#   16 × 4 KV heads × 256 head_dim × ctx × 2 (K+V) × 0.5 B (q4_0)
#     131K ctx q4_0:  ~2,150 MiB
#     131K ctx q8_0:  ~4,300 MiB  ← does not fit
#     131K ctx fp16:  ~8,600 MiB  ← does not fit
#
# Expected allocations (131_072 ctx, 1 slot, q4_0 K/V, FA on, -ub 256):
#   Model weights (Q5_K_M):           ~19,968 MiB
#   KV cache (131K q4_0, 16 layers):   ~2,150 MiB
#   SSM/DeltaNet recurrent state:        ~150 MiB
#   FA scratch @ -ub 256:             ~1,800 MiB  (half of ub512 empirical ~3,600)
#   Compute buffers:                     ~500 MiB
#   ─────────────────────────────────────────────
#   Estimated total:                  ~24,568 MiB → ~24.0 GB — borderline
#   Headroom: minimal. If OOM: switch EXTRA_ARGS to -ub 128 -b 512 (v2).
#
# Sampling: DavidAU recommendation for precise code (low temp, tight top_k).
#
# CHAT TEMPLATE NOTE:
#   The GGUF-embedded template is the pre-Unsloth-fixes version. It supports
#   system/user/assistant only — will raise 'Unexpected message role.' on a
#   `developer`-role message (Codex/OpenCode-style). If openclaw triggers this,
#   uncomment the chat-template-file flag in EXTRA_ARGS below.

# ── Context & Scheduling ────────────────────────────────────────────────────
CONTEXT=131072
PARALLEL=1

# ── KV Cache ────────────────────────────────────────────────────────────────
# q4_0 KV: rotor quants auto-enable (head_dim % 64 == 0), restoring near-q8
# fidelity. Required to fit 131K on 24 GB — q8_0 KV does not fit.
# CACHE_RAM=20480: 20 GB RAM-backed prompt cache for slot warm restores.
CACHE_RAM=20480
CACHE_TYPE_K=q4_0
CACHE_TYPE_V=q4_0
KV_UNIFIED=1

# ── Checkpoints ─────────────────────────────────────────────────────────────
# Lowered from launcher default (32) to reduce checkpoint buffer overhead.
CHECKPOINT_INTERVAL=4096
CHECKPOINT_MAX=2

# ── GPU Offload ─────────────────────────────────────────────────────────────
NGL=99
FLASH_ATTN=1

# ── Sampling (DavidAU recommended for code) ─────────────────────────────────
TEMP=0.6
TOP_P=0.95
TOP_K=20

# ── Reasoning / Thinking ────────────────────────────────────────────────────
REASONING=on
REASONING_BUDGET=-1

# ── Server ──────────────────────────────────────────────────────────────────
HOST=0.0.0.0
PORT=40801
API_KEY=ollama-local
TIMEOUT=3600
THREADS=32

# ── I/O & Memory ────────────────────────────────────────────────────────────
NO_MMAP=1
DIO=1

# ── Template ────────────────────────────────────────────────────────────────
JINJA=1

# ── Extra ───────────────────────────────────────────────────────────────────
# -ub 256 (not 512): FA scratch at ub512 would push total past 24 GB.
# Fallback if OOM: -ub 128 -b 512
# To use developer-role-aware template:
#   EXTRA_ARGS="--min-p 0.0 -ub 256 -b 1024 --chat-template-file /path/to/code/llama-launcher/templates/qwen36-unsloth.j2"
EXTRA_ARGS="--min-p 0.0 -ub 256 -b 1024"
