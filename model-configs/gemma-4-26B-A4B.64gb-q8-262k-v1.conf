# Tune: 64gb-q8-262k-v1
# Per-model config for: gemma-4-26B-A4B-it (Q8_0, MoE 128 experts / 8 active)
# Target: 64 GB system with 15 GB headroom (~49 GB usable)
# Tested: 2026-04-09 on Strix Halo Vulkan (quality verified, VRAM portable)
#
# Architecture: Gemma 4 MoE with Sliding Window Attention
#   - 30 layers: 25 SWA (window=1024) + 5 full attention (layers 5,11,17,23,29)
#   - Full attn layers: 2 KV heads, head_dim=512
#   - SWA layers: 8 KV heads, head_dim=256, window=1024 (fixed cost)
#   - 128 experts, 8 active per token (26B total, ~4B active)
#   - Context: 262144 native
#   - Thinking model: uses <|channel>thought tags (peg-gemma4 template)
#
# VRAM breakdown at 262K context:
#   Model weights (Q8_0):     26,624 MiB (26.0 GB)
#   KV cache full attn (q8_0): 2,560 MiB (5 layers * 2 heads * 512 dim * 262K * 2)
#   KV cache SWA (q8_0):        100 MiB (25 layers * 8 heads * 256 dim * 1024 * 2)
#   Checkpoints (8x ~100 MiB):  800 MiB
#   Compute buffers:           1,780 MiB
#   Total GPU:               ~31,864 MiB (~31.1 GB)
#   Headroom on 64 GB:        ~32.9 GB (well within 15 GB target)
#
# Sampling: Google recommends temp=1.0, top_k=64, top_p=0.95 for Gemma 4.
# CRITICAL: Lower temperatures (0.3-0.5) cause severe repetition loops where
# the model outputs the same multi-paragraph block 10-20 times. The fix is
# NOT anti-repeat penalties — it's using temp=1.0 as designed. Tested: all
# repeat tests pass at temp=1.0 with zero DRY/repeat penalty. Google docs
# explicitly state: "keep repetition/presence penalty disabled or 1.0".
#
# Quality checks (all passed):
#   - Tool calling: correct function selection, valid JSON args, proper finish_reason
#   - Code generation: 12-endpoint FastAPI, zero repeats, single code block
#   - Structured output: Korean quiz, Hangeul recognition — zero repeats
#   - Thinking: reasoning_content properly separated via peg-gemma4 template
#   - Speed: ~43-45 tok/s generation (Vulkan, Strix Halo)
#
# Known issues:
#   - Vulkan: may hit <unused> token loops (llama.cpp #21516) — open bug
#   - ROCm: <unused24> infinite loop on Strix Halo (llama.cpp #21416)
#   - Tool calls: use parallel_tool_calls=false to prevent loop (#21375, fixed in #21418)
#
# Vision: mmproj available but disabled for coding agent use

# ── Context & Scheduling ────────────────────────────────────────────────────
CONTEXT=262144
PARALLEL=1

# ── KV Cache ────────────────────────────────────────────────────────────────
CACHE_RAM=0
CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0
KV_UNIFIED=1

# ── Checkpoints ─────────────────────────────────────────────────────────────
CHECKPOINT_INTERVAL=4096
CHECKPOINT_MAX=8

# ── GPU Offload ─────────────────────────────────────────────────────────────
NGL=99
FLASH_ATTN=1

# ── Sampling ────────────────────────────────────────────────────────────────
# Google-recommended defaults — DO NOT lower temp, causes repeat loops
TEMP=1.0
TOP_P=0.95
TOP_K=64

# ── Anti-repeat ─────────────────────────────────────────────────────────────
# Not needed at temp=1.0. Uncomment only if repeat loops return.
# DRY_MULTIPLIER=0.8
# REPEAT_PENALTY=1.05
# REPEAT_LAST_N=256

# ── Server ──────────────────────────────────────────────────────────────────
HOST=0.0.0.0
PORT=40801
API_KEY=ollama-local
TIMEOUT=3600
THREADS=32

# ── I/O & Memory ────────────────────────────────────────────────────────────
NO_MMAP=1
DIO=1

# ── Template ────────────────────────────────────────────────────────────────
# JINJA=1

# ── Extra ───────────────────────────────────────────────────────────────────
# EXTRA_ARGS=""
